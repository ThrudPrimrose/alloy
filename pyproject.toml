[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy"
version = "0.0.1"
description = "Speculative per-scope code generation backend for DaCe: sweep, verify, and report rendering candidates."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "code-generation", "compilers", "autotuning", "hpc"]
dependencies = [
    "numpy",
    "pydantic>=2",
    # Bare: DaCe extended pins Alloy through its `alloy` extra (pip install "dace[alloy] @ git+...@extended"), so
    # Alloy cannot pin DaCe back. A standalone install needs DaCe extended installed first.
    "dace",
]

[project.optional-dependencies]
# Manifest inputs (fuzzed sizes, initializers) and the tolerance band come from HPCAgent-Bench.
bench = ["hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@f3b6cd7859165c1f29e4681d21528c23d80911a6"]
# Device buffers for GPU verification; the two cupy builds never share an environment.
nvgpu = ["alloy[bench]", "cupy-cuda13x"]
amdgpu = ["alloy[bench]", "cupy ; platform_machine == 'x86_64'"]
dev = ["alloy[bench]", "mypy", "pre-commit", "pyright", "pytest", "pytest-xdist", "ruff==0.15.10"]
dev-nvidia = ["alloy[dev,nvgpu]"]
dev-amd = ["alloy[dev,amdgpu]"]

# Alloy's optimizer flavor as an HPCAgent-Bench plugin (alloy/hb_plugin/plugin.toml).
[project.entry-points."hpcagent_bench.plugins"]
alloy = "alloy.hb_plugin"

# Alloy as DaCe's build: SDFG.compile hands over when DaCe's compiler.build_plugin names one of these.
[project.entry-points."dace.build_plugins"]
alloy-speculative = "alloy.dace_backend:speculative"
alloy-profile = "alloy.dace_backend:profile"

[tool.setuptools.packages.find]
include = ["alloy*"]

[tool.setuptools.package-data]
alloy = ["configuration_matrix.toml", "hb_plugin/plugin.toml", "hb_plugin/skills/*/SKILL.md", "hb_plugin/prompts/*/*.md", "hb_plugin/prompts/*.yaml", "hb_plugin/tools/*.py", "hb_plugin/routes/*.py"]

[tool.uv]
conflicts = [[{ extra = "nvgpu" }, { extra = "amdgpu" }], [{ extra = "dev-nvidia" }, { extra = "dev-amd" }],
    [{ extra = "nvgpu" }, { extra = "dev-amd" }], [{ extra = "amdgpu" }, { extra = "dev-nvidia" }]]
# No ROCm wheel exists: cupy builds from its sdist for HIP (CUPY_INSTALL_USE_HIP=1 at install time).
no-binary-package = ["cupy"]
# Development and CI only (uv): HPCAgent-Bench's dace pin, which helpers/bump_pins.sh copies.
override-dependencies = ["dace @ git+https://github.com/spcl/dace.git@b737e5050501855ef420efb58bcb4102771d99a9"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# One mark per compiler in the matrix; deselect the ones a box lacks, e.g. -m "not icx".
markers = [
    "gcc: needs gcc on PATH",
    "clang: needs clang on PATH",
    "nvhpc: needs the NVIDIA HPC SDK (nvc) on PATH",
    "icx: needs Intel oneAPI (icx) on PATH",
    "sleef: needs SLEEF (libsleefgnuabi) where the linker finds it",
    "avx512: needs an AVX-512 host (hosted CI runners may lack it)",
    "e2e: an LLR kernel of the bench through the whole pipeline",
    "cuda: needs nvcc (compiles device units for sm_89; no device needed)",
    "hip: needs hipcc with hipcub (compiles device units for gfx90a; no device needed)",
]
