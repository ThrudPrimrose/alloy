[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy"
version = "0.0.1"
description = "Speculative per-region code generation backend for DaCe: sweep, verify, and report rendering candidates."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "code-generation", "compilers", "autotuning", "hpc"]
dependencies = [
    "numpy",
    "pydantic>=2",
    # Same pins as NestForge, which imports Alloy as its codegen backend.
    "dace @ git+https://github.com/spcl/dace.git@8f2d2381e440bf8d27966a0597bd83d6d307f34e",
]

[project.optional-dependencies]
# Manifest inputs (fuzzed sizes, initializers) and the tolerance band come from HPCAgent-Bench.
bench = ["hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@7492ed154eac516662b70933769a4c4c32c688e2"]
# Device buffers for GPU verification; the two cupy builds never share an environment.
nvgpu = ["alloy[bench]", "cupy-cuda13x"]
amdgpu = ["alloy[bench]", "cupy ; platform_machine == 'x86_64'"]
dev = ["alloy[bench]", "mypy", "pre-commit", "pyright", "pytest", "pytest-xdist", "ruff==0.15.10"]
dev-nvidia = ["alloy[dev,nvgpu]"]
dev-amd = ["alloy[dev,amdgpu]"]

# Alloy's optimizer flavor as an HPCAgent-Bench plugin (alloy/hb_plugin/plugin.toml).
[project.entry-points."hpcagent_bench.plugins"]
alloy = "alloy.hb_plugin"

[tool.setuptools.packages.find]
include = ["alloy*"]

[tool.setuptools.package-data]
alloy = ["configuration_matrix.toml", "hb_plugin/plugin.toml"]

[tool.uv]
conflicts = [[{ extra = "nvgpu" }, { extra = "amdgpu" }], [{ extra = "dev-nvidia" }, { extra = "dev-amd" }],
    [{ extra = "nvgpu" }, { extra = "dev-amd" }], [{ extra = "amdgpu" }, { extra = "dev-nvidia" }]]
# No ROCm wheel exists: cupy builds from its sdist for HIP (CUPY_INSTALL_USE_HIP=1 at install time).
no-binary-package = ["cupy"]
# The bench pins its own dace; Alloy tracks dace extended ahead of it, so this pin wins over the bench's.
override-dependencies = ["dace @ git+https://github.com/spcl/dace.git@8f2d2381e440bf8d27966a0597bd83d6d307f34e"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# One mark per compiler in the matrix; deselect the ones a box lacks, e.g. -m "not icx".
markers = [
    "gcc: needs gcc on PATH",
    "clang: needs clang on PATH",
    "nvhpc: needs the NVIDIA HPC SDK (nvc) on PATH",
    "icx: needs Intel oneAPI (icx) on PATH",
    "e2e: an LLR kernel of the bench through the whole pipeline",
]
