[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy"
version = "0.0.1"
description = "Speculative per-region code generation backend for DaCe: sweep, verify, and report rendering candidates."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "code-generation", "compilers", "autotuning", "hpc"]
dependencies = [
    "numpy",
    # Same pins as NestForge, which imports Alloy as its codegen backend.
    "dace @ git+https://github.com/spcl/dace.git@dbcb1e8a6adb659e4f6d702efa2c9831ce69afc0",
    "hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@454e88445d84dd90726e18d0eb79830c004e2ea1",
]

[project.optional-dependencies]
dev = ["pre-commit", "pyright", "pytest", "pytest-xdist", "ruff==0.15.10"]

[tool.setuptools.packages.find]
include = ["alloy*"]

[tool.setuptools.package-data]
alloy = ["configuration_matrix.toml"]

[project.scripts]
alloy = "alloy.cli:main"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# One mark per compiler in the matrix; deselect the ones a box lacks, e.g. -m "not icx".
markers = [
    "gcc: needs gcc on PATH",
    "clang: needs clang-21 on PATH",
    "nvhpc: needs the NVIDIA HPC SDK (nvc) on PATH",
    "icx: needs Intel oneAPI (icx) on PATH",
    "e2e: an LLR kernel of the bench through the whole pipeline",
]
