[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy"
version = "0.0.1"
description = "Speculative per-scope code generation backend for DaCe: sweep, verify, and report rendering candidates."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yakup Budanaz", email = "budanaz.yakup@gmail.com" }]
keywords = ["dace", "sdfg", "code-generation", "compilers", "autotuning", "hpc"]
dependencies = [
    "numpy",
    "pydantic>=2",
    # Bare: DaCe extended pins Alloy through its `alloy` extra (pip install "dace[alloy] @ git+...@extended"), so
    # Alloy cannot pin DaCe back. A standalone install needs DaCe extended installed first.
    "dace",
    "sympy",
    "pydantic-core",
    # C to NumPy (alloy.frontend.cnumpy) parses C with tree-sitter's grammar
    "tree-sitter-language-pack",
]

[project.optional-dependencies]
# Manifest inputs (fuzzed sizes, initializers) and the tolerance band come from HPCAgent-Bench.
bench = ["hpcagent_bench @ git+https://github.com/spcl/HPCAgent-Bench.git@9a81172fa6370c0a04857d3b5d15fad9446b6187"]
# Device buffers for GPU verification; the two cupy builds never share an environment.
nvgpu = ["alloy[bench]", "cupy-cuda13x"]
amdgpu = ["alloy[bench]", "cupy ; platform_machine == 'x86_64'"]
dev = ["alloy[bench]", "mpmath", "mypy", "pre-commit", "pyright", "pytest", "pytest-timeout", "pytest-xdist", "ruff==0.17.6"]
# What GVSoC's build and launcher (gapy) import, from gvsoc's requirement files without the documentation tools and
# the build tools, at versions that agree with the rest of the lock; the SoftHier v1 image runs with exactly these (alloy/isa/softhier_pins.toml; helpers/build_softhier.sh installs it).
softhier = ["argparse==1.4.0", "beautifulsoup4==4.15.0", "hjson==3.1.0", "html2text==2025.4.15",
    "lz4==4.4.5", "mako==1.4.3", "marko==2.2.5", "matplotlib==3.11.2", "mistune==3.4.0", "ninja==1.13.2",
    "pandas==3.0.6", "pexpect==4.9.0", "ppk2_api==0.9.2", "prettytable==3.19.0", "psutil==7.2.2",
    "pycryptodome==4.5.0", "pyelftools==0.33", "pytablewriter==1.2.1", "pyvcd==0.5.1", "pyyaml==6.0.3", "rich==15.0.0",
    "six==1.17.0", "tabulate==0.10.0"]
dev-nvidia = ["alloy[dev,nvgpu]"]
dev-amd = ["alloy[dev,amdgpu]"]

# Alloy's optimizer flavor as an HPCAgent-Bench plugin (alloy/hb_plugin/plugin.toml).
[project.entry-points."hpcagent_bench.plugins"]
alloy = "alloy.hb_plugin"

# Alloy as DaCe's build: SDFG.compile hands over when DaCe's compiler.build_plugin names one of these.
[project.entry-points."dace.build_plugins"]
alloy-speculative = "alloy.dace_backend:speculative"

[tool.setuptools.packages.find]
include = ["alloy*"]

[tool.setuptools.package-data]
alloy = ["configuration_matrix.toml", "gpu_matrix.toml", "isa/*.h", "hb_plugin/plugin.toml", "hb_plugin/skills/*/SKILL.md", "hb_plugin/prompt/*.md", "hb_plugin/prompt/*.yaml", "hb_plugin/prompt/*/*.md", "hb_plugin/tools/*.py", "hb_plugin/routes/*.py", "isa/*.toml", "softhiergen/runtime/include/softhiergen/*"]

[tool.uv]
conflicts = [[{ extra = "nvgpu" }, { extra = "amdgpu" }], [{ extra = "dev-nvidia" }, { extra = "dev-amd" }],
    [{ extra = "nvgpu" }, { extra = "dev-amd" }], [{ extra = "amdgpu" }, { extra = "dev-nvidia" }]]
# No ROCm wheel exists: cupy builds from its sdist for HIP (CUPY_INSTALL_USE_HIP=1 at install time).
no-binary-package = ["cupy"]
# Development and CI only (uv): HPCAgent-Bench's dace pin, which helpers/bump_pins.sh copies.
override-dependencies = ["dace @ git+https://github.com/spcl/dace.git@6628a9dd95b0f421767048df7c483d828f7f50d6"]

[tool.mypy]
# Strict static typing for Alloy's own code, as in a statically typed language. The untyped libraries it calls (DaCe,
# the benchmark, tt-metal, torch) are skipped: their values are Any at the boundary, which strict mode makes explicit.
python_version = "3.12"
strict = true
warn_unreachable = true
# Every untyped decorator comes from a skipped library (@dace.program, the benchmark's routes).
disallow_untyped_decorators = false
extra_checks = true

[[tool.mypy.overrides]]
module = ["dace", "dace.*", "hpcagent_bench", "hpcagent_bench.*", "hpcagent_agent", "hpcagent_agent.*", "ttnn",
    "ttnn.*", "torch", "torch.*", "tree_sitter", "tree_sitter.*", "tree_sitter_language_pack", "cupy", "cupy.*",
    "mpmath", "mpmath.*", "sympy", "sympy.*", "yaml"]
follow_imports = "skip"
ignore_missing_imports = true

# The benchmark plugin and the SoftHier backend subclass the benchmark's and DaCe's classes, which the skip above
# makes Any.
[[tool.mypy.overrides]]
module = ["alloy.hb_plugin", "alloy.hb_plugin.*", "alloy.softhiergen", "alloy.softhiergen.*"]
disallow_subclassing_any = false

# The GVSoC verdicts hash this file's bytes (alloy.isa.softhier.digest): an edit voids every recorded run.
[[tool.mypy.overrides]]
module = ["alloy.isa.softhier_harness"]
disallow_any_generics = false
disallow_untyped_calls = false


[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["alloy", "tests", "helpers"]
# Hashed into the GVSoC verdicts (alloy.isa.softhier.digest), so left as recorded.
ignore = ["alloy/isa/softhier_harness.py"]
typeCheckingMode = "strict"
# Types that come from the untyped libraries above are unknown to pyright; every type Alloy declares is checked.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
# Tests import their own helpers.py, as pytest puts tests/ on the path.
executionEnvironments = [{ root = "tests", extraPaths = ["tests", "."] }, { root = "." }]

[tool.pytest.ini_options]
# A hung child or compiler fails its test with a traceback instead of eating the CI job budget.
timeout = 900
# One mark per compiler in the matrix; deselect the ones a box lacks, e.g. -m "not icx".
markers = [
    "gcc: needs gcc on PATH",
    "clang: needs clang on PATH",
    "nvhpc: needs the NVIDIA HPC SDK (nvc) on PATH",
    "icx: needs Intel oneAPI (icx) on PATH",
    "sleef: needs SLEEF with its static libsleefgnuabi.a where the compiler finds it (helpers/install-sleef.sh)",
    "avx512: needs an AVX-512 host (hosted CI runners may lack it)",
    "e2e: an LLR kernel of the bench through the whole pipeline",
    "cuda: needs nvcc (compiles device units for sm_89; no device needed)",
    "hip: needs hipcc with hipcub (compiles device units for gfx90a; no device needed)",
    "tensix: needs docker; runs every Tensix row on ttsim inside the pinned tt-metal image",
    "softhier: needs GVSoC with the SoftHier v1 target and the GCC 14 RISC-V toolchain (SOFTHIER_GVSOC, SOFTHIER_SDK); skipped without them",
    "nvidia: needs an NVIDIA GPU to run on (and nvcc)",
]
