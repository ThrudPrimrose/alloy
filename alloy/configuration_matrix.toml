# Alloy configuration matrix: every compiler, flag and codegen option the sweep tries.
# Checked by alloy/configuration_matrix.py; `api.generate(..., matrix=configuration_matrix.load(other))` swaps it and every report keeps a copy.
# Shared sections say what an option MEANS (tolerances, gating); each compiler says how IT spells the option.
schema = 1

# Explicit defaults: the one-factor sweep starts here, and `fp_level` is the verification reference.
[defaults]
fp_level = "strict"
index_width = "int64"
cost_model = "default"
openmp_runtime = "libomp"  # the process's one OpenMP runtime; every candidate must link against it

[timing]
# Screen every verified candidate on screen_cores physical cores at screen_cache_factor x the largest cache, then
# re-time the top ones on every physical core at the largest preset, grown to at least final_cache_factor x it.
screen_cores = 4
screen_cache_factor = 3.0
final_cache_factor = 2.0
# Scope sizes share symbols with the rest of the program: never let the program touch more than this x the cache.
max_program_cache_factor = 16.0
screen_reps = 11
final_reps = 31
top = 3

[build]
flags = ["-O3", "-march=native", "-fPIC"]

[gating]
# libm calls a vector math library can replace. sqrt/fabs/fma are single instructions and need none.
libm_calls = [
    "sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh",
    "exp", "exp2", "expm1", "log", "log2", "log10", "log1p", "pow", "cbrt", "erf", "erfc",
]

# render: the CPF dialect (dace.codegen.cpf.render language) the unit is written in.
[languages.c]
render = "c"
std = "-std=c23"
suffix = "c"

[languages.cpp]
render = "c++"
std = "-std=c++20"
suffix = "cpp"

# A candidate is kept only if every OpenMP symbol its object needs is exported by the runtime's shared object.
# libomp carries a GOMP compatibility layer, so gcc objects can link against it.
[openmp_runtimes.libomp]
soname = "omp"

[openmp_runtimes.libgomp]
soname = "gomp"

[openmp_runtimes.libnvomp]  # NVHPC's runtime
soname = "nvomp"

# tolerance: "exact" = bit-identical to the reference build (the strict level IS that reference); "band" = HPCAgent-Bench's
# per-precision band (hpcagent_bench.precision.TOLERANCE_MATRIX) with its accumulation floor
# eps_acc(p) * sqrt(l) * ||ref||_inf, l = the scope's accumulation length (Scope.accumulation_length).
# needs: the scope property a level requires ("reduction", or "finite_inputs" = declared with --finite-inputs).
[fp_levels.strict]
tolerance = "exact"

[fp_levels.contract]
tolerance = "band"

[fp_levels.noerrno]
tolerance = "band"

[fp_levels.reassoc]
tolerance = "band"
needs = "reduction"

[fp_levels.fast]
tolerance = "band"
needs = "finite_inputs"

# A vector ISA narrower or more specific than -march=native; a candidate's ISA flags follow the build flags. host_flag:
# the /proc/cpuinfo flag the host must have, else the ISA is skipped; vector_bytes: its register width, 0 when
# length-agnostic. The x86 spellings were checked by the vector registers in the assembly (ymm vs zmm) on a Zen 4; the
# aarch64 ones by the z vs v registers of gcc 15 and clang 21 cross compiles for -mcpu=neoverse-v1, neoverse-v2 and
# a64fx. On neoverse-v2 (128-bit SVE) both pick NEON unless forced. Ordered FP reductions use SVE fadda even under the
# neon spelling. Confirm the aarch64 ones on Grace.
[isas.avx2]
host_flag = "avx2"
vector_bytes = 32

[isas.avx512_256]  # AVX-512 instructions at 256-bit width
host_flag = "avx512f"
vector_bytes = 32

[isas.avx512]
host_flag = "avx512f"
vector_bytes = 64

[isas.neon]
host_flag = "asimd"
vector_bytes = 16

[isas.sve]
host_flag = "sve"
vector_bytes = 0

# The tail of a vectorized loop. isas: the ISAs with masks it needs (empty: any ISA). render = "sve": the scope's
# innermost maps become explicit Arm SVE predicated loops (DaCe's SVEVectorization) instead of being left to the
# auto-vectorizer. A candidate without a tail keeps the compiler's own choice.
[tails.scalar_remainder]
isas = []

[tails.masked_remainder]  # unmasked main loop, masked epilogue
isas = ["avx512_256", "avx512", "sve"]

[tails.full_mask]  # every iteration masked, no epilogue
isas = ["avx512_256", "avx512", "sve"]

[tails.sve_intrinsics]
isas = ["sve"]
render = "sve"

# probe: library name the linker must find. fp_level: the level a vector-library candidate builds at.
[veclibs.libmvec]
probe = "mvec"
fp_level = "noerrno"

[veclibs.sleef]
probe = "sleefgnuabi"
fp_level = "noerrno"

# Arm Performance Libraries (aarch64): armpl_sv* calls under SVE, armpl_v*q under NEON.
[veclibs.armpl]
probe = "armpl"
fp_level = "noerrno"

# gcc reaches glibc's simd variants only under __FAST_MATH__, so its libmvec build is the fast level.
[veclibs.libmvec_fast]
probe = "mvec"
fp_level = "fast"

# Each compiler: executables per language, remark flags, support libraries its objects need at link time (resolved
# like the OpenMP runtime), and its spelling of every runtime, FP level, cost model
# and vector library it supports. Every FP level must be spelled; a missing runtime or vector library means
# "unsupported". A compiler whose executable is not on PATH is reported as skipped.
[compilers.gcc]
c = "gcc"
cpp = "g++"
remarks = ["-fopt-info-vec-optimized", "-fopt-info-vec-missed"]

[compilers.gcc.openmp]
libomp = ["-fopenmp"]
libgomp = ["-fopenmp"]

[compilers.gcc.fp]
strict = ["-ffp-contract=off", "-fexcess-precision=standard"]
contract = ["-ffp-contract=fast", "-fexcess-precision=standard"]
noerrno = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math"]
reassoc = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math", "-fno-signed-zeros"]
fast = ["-ffast-math"]

[compilers.gcc.cost_model]
default = []
cheap = ["-fvect-cost-model=cheap"]
no_vec = ["-fno-tree-vectorize"]

[compilers.gcc.veclib]
libmvec_fast = ["-fopenmp-simd", "-ffast-math"]

[compilers.gcc.isa]
avx2 = ["-mno-avx512f"]
avx512_256 = ["-mprefer-vector-width=256"]
avx512 = ["-mprefer-vector-width=512"]
neon = ["--param=aarch64-autovec-preference=asimd-only"]
sve = ["--param=aarch64-autovec-preference=sve-only"]

# 0: scalar remainder loop; 1: masked epilogue; 2: every iteration masked. Checked by the masked operands in the asm.
[compilers.gcc.tail]
scalar_remainder = ["--param=vect-partial-vector-usage=0"]
masked_remainder = ["--param=vect-partial-vector-usage=1"]
full_mask = ["--param=vect-partial-vector-usage=2"]
sve_intrinsics = []

# clang/clang++ on PATH must come with its LLVM libomp; point PATH (or a copied matrix) at the version that has it.
[compilers.clang]
c = "clang"
cpp = "clang++"
remarks = ["-Rpass=loop-vectorize", "-Rpass-missed=loop-vectorize", "-Rpass-analysis=loop-vectorize"]

[compilers.clang.openmp]
libomp = ["-fopenmp=libomp"]

[compilers.clang.fp]
strict = ["-ffp-contract=off"]
contract = ["-ffp-contract=fast"]
noerrno = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math"]
reassoc = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math", "-fno-signed-zeros"]
fast = ["-ffast-math"]

[compilers.clang.cost_model]
default = []
no_vec = ["-fno-vectorize", "-fno-slp-vectorize"]

[compilers.clang.veclib]
libmvec = ["-fveclib=libmvec", "-fno-math-errno"]
# SLEEF's GNU-ABI library exports glibc's vector names (_ZGV*), which -fveclib=libmvec emits on x86-64 and aarch64
# alike; -fveclib=SLEEF exists only for aarch64. Linking -lsleefgnuabi binds the calls to SLEEF instead of libmvec.
sleef = ["-fveclib=libmvec", "-fno-math-errno"]
armpl = ["-fveclib=ArmPL", "-fno-math-errno"]

[compilers.clang.isa]
avx2 = ["-mno-avx512f"]
avx512_256 = ["-mprefer-vector-width=256"]
avx512 = ["-mprefer-vector-width=512"]
neon = ["-mllvm", "-scalable-vectorization=off"]
# neoverse-v2 tuning prefers fixed width at equal cost, which keeps NEON under scalable-vectorization alone
sve = ["-mllvm", "-scalable-vectorization=preferred", "-mllvm", "-sve-prefer-fixed-over-scalable-if-equal=false"]

# clang folds the tail into masks or keeps a scalar epilogue; it has no masked-epilogue mode.
[compilers.clang.tail]
scalar_remainder = ["-mllvm", "-prefer-predicate-over-epilogue=scalar-epilogue"]
full_mask = ["-mllvm", "-prefer-predicate-over-epilogue=predicate-dont-vectorize"]
sve_intrinsics = []

# Intel oneAPI; on PATH after `source /opt/intel/oneapi/setvars.sh`. icx defaults to -fp-model=fast, so every
# level is spelled explicitly.
[compilers.icx]
c = "icx"
cpp = "icpx"
remarks = ["-Rpass=loop-vectorize", "-Rpass-missed=loop-vectorize", "-Rpass-analysis=loop-vectorize"]

[compilers.icx.openmp]
libomp = ["-fiopenmp"]

[compilers.icx.fp]
strict = ["-fp-model=strict"]
contract = ["-fp-model=precise", "-ffp-contract=fast"]
noerrno = ["-fp-model=precise", "-ffp-contract=fast", "-fno-math-errno"]
reassoc = ["-fp-model=precise", "-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math",
    "-fno-signed-zeros"]  # -fp-model=fast also assumes finite inputs, which only the fast level may
fast = ["-fp-model=fast=2", "-ftz"]

[compilers.icx.cost_model]
default = []
no_vec = ["-fno-vectorize", "-fno-slp-vectorize"]

[compilers.icx.isa]
avx2 = ["-mno-avx512f"]
avx512_256 = ["-mprefer-vector-width=256"]
avx512 = ["-mprefer-vector-width=512"]

# NVIDIA HPC SDK; on PATH after adding /opt/nvidia/hpc_sdk/Linux_x86_64/<ver>/compilers/bin. Its flag spellings
# and whether its objects link against libomp are what the CI interop job checks; trust them only once it is green.
[compilers.nvhpc]
c = "nvc"
cpp = "nvc++"
remarks = ["-Minfo=vect"]
support_libraries = ["nvc", "nvcpumath"]  # nvc objects call its runtime helpers (e.g. __c_mset8)

[compilers.nvhpc.openmp]
libnvomp = ["-mp"]
libomp = ["-mp"]

[compilers.nvhpc.fp]
strict = ["-Kieee", "-Mnofma"]
contract = ["-Kieee", "-Mfma"]
noerrno = ["-Kieee", "-Mfma"]  # nvc has no errno switch and vectorizes libm with its own vector math
reassoc = ["-Mfma", "-Mfprelaxed"]
fast = ["-fast"]

[compilers.nvhpc.cost_model]
default = []
no_vec = ["-Mnovect"]

[compilers.nvhpc.isa]  # -tp names a CPU model; only the generic AVX2 one is listed
avx2 = ["-tp=haswell"]

# Readable-codegen knobs (compiler.cpu.codegen_params); the first value is DaCe's default.
[codegen.knobs]
loop_access_form = ["indexed", "ptr_increment"]
heap_ptr_restrict = ["restrict", "none"]
const_scalar_abi = ["by_ref", "by_value"]
decl_placement = ["eager", "late"]
scalar_init_style = ["split", "fused"]

# Index width moves as one axis: int32 helpers under int64 counters cost gcc its vectorization
# (samples/index_width), so only matched pairs are candidates.
[codegen.index_widths.int64]
index_ctype = "int64"
loop_index_type = "inferred"

[codegen.index_widths.int32]
index_ctype = "int32"
loop_index_type = "int32"
