# Alloy configuration matrix: every compiler, flag and codegen option the sweep tries.
# Checked by alloy/configuration_matrix.py; `alloy build --matrix other.toml` swaps it and every report keeps a copy.
# Shared sections say what an option MEANS (tolerances, gating); each compiler says how IT spells the option.
schema = 1

# Explicit defaults: the one-factor sweep starts here, and `fp_level` is the verification reference.
[defaults]
fp_level = "strict"
index_width = "int64"
cost_model = "default"
openmp_runtime = "libomp"  # the process's one OpenMP runtime; every candidate must link against it

[build]
flags = ["-O3", "-march=native", "-fPIC"]

[gating]
# libm calls a vector math library can replace. sqrt/fabs/fma are single instructions and need none.
libm_calls = [
    "sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh",
    "exp", "exp2", "expm1", "log", "log2", "log10", "log1p", "pow", "cbrt", "erf", "erfc",
]

# render: the CPF dialect (dace.codegen.cpf.render language) the unit is written in.
[languages.c]
render = "c"
std = "-std=c23"
suffix = "c"

[languages.cpp]
render = "c++"
std = "-std=c++20"
suffix = "cpp"

# A candidate is kept only if every OpenMP symbol its object needs is exported by the runtime's shared object.
# libomp carries a GOMP compatibility layer, so gcc objects can link against it.
[openmp_runtimes.libomp]
soname = "omp"

[openmp_runtimes.libgomp]
soname = "gomp"

[openmp_runtimes.libnvomp]  # NVHPC's runtime
soname = "nvomp"

# tolerance: "exact" = bit-identical to the reference build (the strict level IS that reference); "band" = HPCAgent-Bench's
# per-precision band (hpcagent_bench.precision.TOLERANCE_MATRIX) with its accumulation floor
# eps_acc(p) * sqrt(l) * ||ref||_inf, l = the region's accumulation length (Region.accumulation_length).
# needs: the region property a level requires ("reduction", or "finite_inputs" = declared with --finite-inputs).
[fp_levels.strict]
tolerance = "exact"

[fp_levels.contract]
tolerance = "band"

[fp_levels.noerrno]
tolerance = "band"

[fp_levels.reassoc]
tolerance = "band"
needs = "reduction"

[fp_levels.fast]
tolerance = "band"
needs = "finite_inputs"

# probe: library name the linker must find. fp_level: the level a vector-library candidate builds at.
[veclibs.libmvec]
probe = "mvec"
fp_level = "noerrno"

[veclibs.sleef]
probe = "sleefgnuabi"
fp_level = "noerrno"

# Each compiler: executables per language, remark flags, and its spelling of every runtime, FP level, cost model
# and vector library it supports. Every FP level must be spelled; a missing runtime or vector library means
# "unsupported". A compiler whose executable is not on PATH is reported as skipped.
[compilers.gcc]
c = "gcc"
cpp = "g++"
remarks = ["-fopt-info-vec-optimized", "-fopt-info-vec-missed"]

[compilers.gcc.openmp]
libomp = ["-fopenmp"]
libgomp = ["-fopenmp"]

[compilers.gcc.fp]
strict = ["-ffp-contract=off", "-fexcess-precision=standard"]
contract = ["-ffp-contract=fast", "-fexcess-precision=standard"]
noerrno = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math"]
reassoc = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math", "-fno-signed-zeros"]
fast = ["-ffast-math"]

[compilers.gcc.cost_model]
default = []
cheap = ["-fvect-cost-model=cheap"]
no_vec = ["-fno-tree-vectorize"]

[compilers.gcc.veclib]
libmvec = ["-fopenmp-simd", "-ffast-math"]  # glibc declares the simd variants only under __FAST_MATH__

# clang 22 has no libomp-22-dev on the development box, so clang 21.
[compilers.clang]
c = "clang-21"
cpp = "clang++-21"
remarks = ["-Rpass=loop-vectorize", "-Rpass-missed=loop-vectorize", "-Rpass-analysis=loop-vectorize"]

[compilers.clang.openmp]
libomp = ["-fopenmp=libomp"]

[compilers.clang.fp]
strict = ["-ffp-contract=off"]
contract = ["-ffp-contract=fast"]
noerrno = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math"]
reassoc = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math", "-fno-signed-zeros"]
fast = ["-ffast-math"]

[compilers.clang.cost_model]
default = []
no_vec = ["-fno-vectorize", "-fno-slp-vectorize"]

[compilers.clang.veclib]
libmvec = ["-fveclib=libmvec", "-fno-math-errno"]
sleef = ["-fveclib=SLEEF", "-fno-math-errno"]

# Intel oneAPI; on PATH after `source /opt/intel/oneapi/setvars.sh`. icx defaults to -fp-model=fast, so every
# level is spelled explicitly.
[compilers.icx]
c = "icx"
cpp = "icpx"
remarks = ["-Rpass=loop-vectorize", "-Rpass-missed=loop-vectorize", "-Rpass-analysis=loop-vectorize"]

[compilers.icx.openmp]
libomp = ["-fiopenmp"]

[compilers.icx.fp]
strict = ["-fp-model=strict"]
contract = ["-fp-model=precise", "-ffp-contract=fast"]
noerrno = ["-fp-model=precise", "-ffp-contract=fast", "-fno-math-errno"]
reassoc = ["-fp-model=fast"]
fast = ["-fp-model=fast=2", "-ftz"]

[compilers.icx.cost_model]
default = []
no_vec = ["-fno-vectorize", "-fno-slp-vectorize"]

# NVIDIA HPC SDK; on PATH after adding /opt/nvidia/hpc_sdk/Linux_x86_64/<ver>/compilers/bin. Its flag spellings
# and whether its objects link against libomp are what the CI interop job checks; trust them only once it is green.
[compilers.nvhpc]
c = "nvc"
cpp = "nvc++"
remarks = ["-Minfo=vect"]

[compilers.nvhpc.openmp]
libnvomp = ["-mp"]
libomp = ["-mp"]

[compilers.nvhpc.fp]
strict = ["-Kieee", "-Mnofma"]
contract = ["-Kieee", "-Mfma"]
noerrno = ["-Kieee", "-Mfma"]  # nvc has no errno switch and vectorizes libm with its own vector math
reassoc = ["-Mfma", "-Mfprelaxed"]
fast = ["-fast"]

[compilers.nvhpc.cost_model]
default = []
no_vec = ["-Mnovect"]

# Readable-codegen knobs (compiler.cpu.codegen_params); the first value is DaCe's default.
[codegen.knobs]
loop_access_form = ["indexed", "ptr_increment"]
heap_ptr_restrict = ["restrict", "none"]
const_scalar_abi = ["by_ref", "by_value"]
decl_placement = ["eager", "late"]
scalar_init_style = ["split", "fused"]

# Index width moves as one axis: int32 helpers under int64 counters cost gcc its vectorization
# (samples/index_width), so only matched pairs are candidates.
[codegen.index_widths.int64]
index_ctype = "int64"
loop_index_type = "inferred"

[codegen.index_widths.int32]
index_ctype = "int32"
loop_index_type = "int32"
