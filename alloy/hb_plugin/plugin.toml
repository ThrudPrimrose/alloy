name = "alloy"
description = "Alloy: every scope's rendering candidates built and verified; the fastest by judge timing (profile) or the predicted pick (speculative) delivered."
# Every candidate links LLVM's OpenMP (configuration_matrix.toml): the judge serves libomp to Alloy's processes.
openmp = "libomp"

# The package alloy, built from the repository into the judge's interpreter; its dependencies are the benchmark's own.
[install]
root = "../.."
command = ["uv", "pip", "install", "--python", "{python}", "--no-deps", "{root}"]

# What HPCAgent-Bench's user-plugins CI runs: the stub agent through the alloy_speculative tool, and the speculative
# flavor, on the CPU.
[ci]
optimizers = ["dace_cpu_canon_alloy_stub", "dace_cpu_canon_alloy_speculative"]
kernels = ["tsvc_2_vpv", "atax"]
language = "c"

# Alloy for an LLM agent: one mode tool each, described by the alloy skill page, plus the intrinsics reference with
# its own page; prompt/overlay.yaml says what Alloy does after both prompts' intro and starts the agent's end-to-end
# steps from Alloy's library.
[packets.alloy-profile]
name = "Alloy (profile)"
skills = ["alloy", "alloy-isa"]
tools = ["alloy_profile", "alloy_isa"]
overlays = ["alloy:prompt/overlay.yaml"]
env = { JUDGE_INPUT_MODE = "any" }  # the tool hands back a library, submitted as is

[packets.alloy-speculative]
extends = "alloy-profile"
name = "Alloy (speculative)"
tools = ["alloy_speculative", "alloy_isa"]

# Every Alloy tool, with the choice left to the agent: whether to call a mode tool, which one, and when.
[packets.alloy]
name = "Alloy (all tools)"
skills = ["alloy", "alloy-isa"]
tools = ["alloy_profile", "alloy_speculative", "alloy_isa"]
overlays = ["alloy:prompt/overlay-choice.yaml"]
env = { JUDGE_INPUT_MODE = "any" }  # a mode tool hands back a library, submitted as is

# The intrinsics reference alone: the agent writes its own source, so the input mode stays the benchmark's.
[packets.alloy-isa]
name = "Alloy (ISA lookup)"
skills = ["alloy-isa"]
tools = ["alloy_isa"]

[flavors.alloy_profile]
name = "Alloy profile"
full_name = "Alloy (profiled)"
optimizer = "alloy.hb_plugin.tuners:AlloyProfileOptimizer"
# GPU: canon only, the one pipeline that hands its offloaded program to a tuner (PipelineContext.offloaded)
extends = ["dace_cpu_canon", "dace_cpu_parallel", "dace_cpu_autoopt", "dace_gpu_canon"]

# E1's column at the reference's FP flags (design item D3): CPU canon only.
[flavors.alloy_profile_ref_fp]
name = "Alloy profile, reference FP"
full_name = "Alloy (profiled, at the reference's FP flags)"
optimizer = "alloy.hb_plugin.tuners:AlloyProfileReferenceFPOptimizer"
extends = ["dace_cpu_canon"]

[flavors.alloy_speculative]
name = "Alloy speculative"
full_name = "Alloy (speculative)"
optimizer = "alloy.hb_plugin.tuners:AlloySpeculativeOptimizer"
# GPU: canon only, the one pipeline that hands its offloaded program to a tuner (PipelineContext.offloaded)
extends = ["dace_cpu_canon", "dace_cpu_parallel", "dace_cpu_autoopt", "dace_gpu_canon"]

# The baseline column through the same judge: the pipeline's default rendering, no scope outlined.
[flavors.alloy_none]
name = "Alloy none"
full_name = "DaCe default (Alloy baseline)"
optimizer = "alloy.hb_plugin.tuners:AlloyReferenceOptimizer"
extends = ["dace_cpu_canon", "dace_cpu_parallel", "dace_cpu_autoopt"]

# A stand-in for an LLM agent on the alloy-speculative packet, for CI: one tool call, its library submitted.
[flavors.alloy_stub]
name = "Alloy stub"
full_name = "Alloy (stub agent)"
optimizer = "alloy.hb_plugin.tuners:AlloyToolStub"
extends = ["dace_cpu_canon"]

# The agent-study configurations (alloy-workspace notes/design-review-2026-11-18.md, "Ablation"): one base prompt and one
# task spec. `none` is the no-packet control "", `tool` is alloy-isa above. prompt-only adds guidance and no facts;
# docs-md the vendor's pages by the rule in pages.py; facts-page the lookup's facts for one target as one page
# (`python -m alloy.hb_plugin.pages` writes both kinds of page).
[packets.accel-guidance]
name = "Unfamiliar-accelerator guidance (no facts)"
overlays = ["alloy:prompt/overlay-guidance.yaml"]

[packets.tt-docs-md]
name = "tt-metal v0.63.0 docs and kernel API headers"
skills = ["tt-metal-compute-api", "tt-metal-dataflow-api", "tt-metal-docs"]

# `tool` per target: alloy_isa answers only for the task's target (tools/alloy.py TARGETS_ENV).
[packets.alloy-isa-tensix]
extends = "alloy-isa"
name = "Alloy (ISA lookup, Tensix)"
env = { ALLOY_ISA_TARGETS = "tensix" }

[packets.alloy-isa-softhier]
extends = "alloy-isa"
name = "Alloy (ISA lookup, SoftHier)"
env = { ALLOY_ISA_TARGETS = "softhier" }

[packets.alloy-facts-tensix]
name = "Alloy facts page (Tensix)"
skills = ["alloy-facts-tensix"]

[packets.alloy-facts-softhier]
name = "Alloy facts page (SoftHier)"
skills = ["alloy-facts-softhier"]
