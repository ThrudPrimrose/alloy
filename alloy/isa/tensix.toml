# SFPI math kernels: written on SFPU lanes for ops whose tile call is less accurate than f32 on a tt-metal version.
# `code` goes in the compute kernel source above namespace NAMESPACE; `init` and `call` run it on DST tile 0.
[[rungs.log]]
name = "alloy_log_f32_sfpi"
dtype = "f32"
unit = "SFPU"
error_ulp = 3.79
card = "tt-metal 0.63, Blackhole p150, 2026-11-18, alloy-tenstorrent agents commit 7d69842: max abs error 3.05e-07, max rel error 2.26e-07 over x log-uniform in [1e-3, 1e3], worst x 0.99999958"
init = "MATH((llk_math_eltwise_unary_sfpu_init<SfpuType::unused, APPROX>()))"
call = "MATH((_llk_math_eltwise_unary_sfpu_params_<APPROX>(alloy_log_f32_face, 0, (int)VectorMode::RC)))"
note = "dev: built after the pilot's failures, when log_tile on 0.63 missed f32 by 0.0165. Alloy's CPU rung alloy_log_f32_fast on SFPU lanes, with one change: exexp and setexp split the exponent and mantissa (no integer add and shift of the bit pattern), and the division f / (2 + f) is approx_recip plus two Newton steps. The polynomial and the ln2 hi/lo split are the CPU rung's. On the card probe it took 1.8 ms where log_tile took 0.7 ms. The compute kernel includes compute_kernel_api.h, which under TRISC_MATH declares sfpi, SfpuType, VectorMode and the llk SFPU helpers; keep fp32_dest_acc_en and UnpackToDestFp32, or DST holds bf16. Contract: finite x; 0 gives -inf, negative x NaN."
code = '''
#ifdef TRISC_MATH
// f32 log on SFPU lanes: x = 2^n * m, m in [sqrt(1/2), sqrt(2)), f = m - 1,
// s = f / (2 + f), log x = n ln2 + 2s + s R(s^2) (Alloy rung alloy_log_f32_fast).
sfpi_inline sfpi::vFloat alloy_log_f32(sfpi::vFloat x) {
    sfpi::vInt e = sfpi::exexp(x);          // unbiased exponent
    sfpi::vFloat m = sfpi::setexp(x, 127);  // mantissa in [1, 2)
    v_if (m > 1.41421356f) {
        m = m * 0.5f;
        e = e + 1;
    }
    v_endif;
    // int32_to_float reads sign-magnitude, as in ckernel_sfpu_log.h
    v_if (e < 0) { e = sfpi::setsgn(~e + 1, 1); }
    v_endif;
    sfpi::vFloat n = sfpi::int32_to_float(e, 0);
    sfpi::vFloat f = m - 1.0f;
    sfpi::vFloat d = f + 2.0f;
    // 1/d: hardware estimate plus two Newton steps, d in [1.7, 2.5)
    sfpi::vFloat r = sfpi::approx_recip(d);
    sfpi::vFloat two = 2.0f;
    r = r * (two - d * r);
    r = r * (two - d * r);
    sfpi::vFloat s = f * r;
    sfpi::vFloat z = s * s;
    sfpi::vFloat c1 = 0.41215285658836365f;
    sfpi::vFloat c0 = 0.6665537357330322f;
    sfpi::vFloat big = z * (c1 * z + c0);
    sfpi::vFloat lo = s * (f - big);
    sfpi::vFloat ln2hi = 0.693145751953125f;
    sfpi::vFloat ln2lo = 1.428606765330187e-06f;
    sfpi::vFloat v = n * ln2hi + (f + (n * ln2lo - lo));
    v_if (x == 0.0f) { v = -std::numeric_limits<float>::infinity(); }
    v_endif;
    v_if (x < 0.0f) { v = std::numeric_limits<float>::quiet_NaN(); }
    v_endif;
    return v;
}

// one face: 8 rows of 32 lanes per iteration
inline void alloy_log_f32_face() {
#pragma GCC unroll 0
    for (int d = 0; d < 8; d++) {
        sfpi::dst_reg[0] = alloy_log_f32(sfpi::dst_reg[0]);
        sfpi::dst_reg++;
    }
}
#endif
'''

[[rungs.exp]]
name = "alloy_exp_f32_sfpi"
dtype = "f32"
unit = "SFPU"
error_ulp = 2.0
card = "tt-metal 0.63, Blackhole p150, 2026-11-18, alloy-tenstorrent agents commit 8ec7b7d (probe_exp_wide-sfpi): max rel error 1.19e-07 over x uniform in [-100, 100] against an f32-saturating reference (inf above ln FLT_MAX, 0 below the smallest normal), worst x -53.63; commit 5cc4565 (without the saturation): max rel 9.87e-08 over [-7, 7]"
init = "MATH((llk_math_eltwise_unary_sfpu_init<SfpuType::unused, APPROX>()))"
call = "MATH((_llk_math_eltwise_unary_sfpu_params_<APPROX>(alloy_exp_f32_face, 0, (int)VectorMode::RC)))"
note = "dev: built after the pilot's failures, when exp_tile on 0.63 held bf16 only (rel 1.73e-3: the metal layer runs Moroz exp_21f, as exp2_tile does). n = round(x / ln2) by the 1.5 * 2^23 shifter, r = x - n ln2 with the ln2 hi/lo split of the log rung, Taylor degree 7 on |r| <= ln2 / 2, and 2^n added to the result's exponent by setexp. Saturates: inf for x >= ln FLT_MAX (88.72), 0 for x <= -87.34 (below the smallest normal; the SFPU flushes subnormals). On the card probe it took 1.9 ms. Same includes and compute config as the log rung."
code = '''
#ifdef TRISC_MATH
// f32 exp on SFPU lanes for every finite x (saturating): n = round(x / ln2) by the 1.5 * 2^23 shifter,
// r = x - n ln2 (hi/lo split), p = Taylor degree 7 on |r| <= ln2 / 2, exp x = p * 2^n.
sfpi_inline sfpi::vFloat alloy_exp_f32(sfpi::vFloat x) {
    sfpi::vFloat shifter = 12582912.0f;  // 1.5 * 2^23: t's low mantissa bits hold n
    sfpi::vFloat inv_ln2 = 1.4426950408889634f;
    sfpi::vFloat t = x * inv_ln2 + shifter;
    sfpi::vFloat nf = t - shifter;
    sfpi::vInt n = sfpi::reinterpret<sfpi::vInt>(t) - 0x4B400000;
    sfpi::vFloat ln2hi = 0.693145751953125f;
    sfpi::vFloat ln2lo = 1.428606765330187e-06f;
    sfpi::vFloat r = x - nf * ln2hi;
    r = r - nf * ln2lo;
    sfpi::vFloat p = 1.9841269841269841e-04f;  // 1/7!
    p = p * r + 1.3888888888888889e-03f;
    p = p * r + 8.3333333333333332e-03f;
    p = p * r + 4.1666666666666664e-02f;
    p = p * r + 1.6666666666666666e-01f;
    p = p * r + 0.5f;
    p = p * r + 1.0f;
    p = p * r + 1.0f;
    // p in [0.7, 1.42]: add n to its biased exponent
    sfpi::vFloat e = sfpi::setexp(p, sfpi::exexp_nodebias(p) + n);
    // saturate where the exponent field would overflow or underflow: inf above ln(FLT_MAX), 0 below the
    // smallest normal (f32 denormals flush to zero)
    v_if (x >= 88.72283935546875f) { e = __builtin_inff(); }
    v_endif;
    v_if (x <= -87.33654022216797f) { e = 0.0f; }
    v_endif;
    return e;
}

inline void alloy_exp_f32_face() {
#pragma GCC unroll 0
    for (int d = 0; d < 8; d++) {
        sfpi::dst_reg[0] = alloy_exp_f32(sfpi::dst_reg[0]);
        sfpi::dst_reg++;
    }
}
#endif
'''

# Moves between a circular buffer and DST (design T5). The harness runs both in one program: copy_tile unpacks the
# CB's tile to DST, pack_tile packs DST back to the output CB; the output must equal the input bit for bit.
[[ops.load]]
kind = "move"
unit = "unpack"
header = "tile_move_copy.h"
init = { v06 = "copy_tile_to_dst_init_short(cb)", v08 = "copy_init(cb)" }
call = "copy_tile(cb, 0, dst)"
domain = [-8.0, 8.0]
note = "CB tile 0 into DST tile dst, between tile_regs_acquire() and tile_regs_commit(), after cb_wait_front(cb, 1). f32 keeps its 32 bits only with fp32_dest_acc_en and UnpackToDestFp32 on the CB."

[[ops.store]]
kind = "move"
unit = "pack"
header = "tile_move_copy.h"
init = { v06 = "pack_reconfig_data_format(cb)", v08 = "pack_reconfig_data_format(cb)" }
call = "pack_tile(dst, cb)"
domain = [-8.0, 8.0]
note = "DST tile dst into the next free slot of CB cb, between tile_regs_wait() and tile_regs_release(), after cb_reserve_back(cb, 1); then cb_push_back(cb, 1). The init is needed only when the CB's data format differs from the last pack."

[[ops.transpose]]
kind = "transpose"
unit = "unpack"
header = "transpose.h"  # transpose_wh.h in 0.6x
init = { v06 = "transpose_wh_init(c0, c16)", v08 = "transpose_init(c0)" }
call = { v06 = "transpose_wh_tile(c0, 0, 0)", v08 = "transpose_tile(c0, 0, 0)" }
domain = [-8.0, 8.0]
note = "Transposes one 32x32 tile (rows to columns) on its way from the CB into DST: the unpacker reads it transposed, so no separate copy_tile."
