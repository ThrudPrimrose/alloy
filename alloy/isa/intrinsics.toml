# The op x dtype x ISA instruction table: the abstract math ops of alloy/isa/ops.py spelled as C
# intrinsics (and assembly mnemonics) per vector ISA. Checked-in reference data; every spelling was
# verified against the clang resource headers (immintrin.h chain, arm_neon.h, arm_sve.h). Sources:
# the per-target ESSENTIALS sheets of the ISA docs package (Intel SDM ch.14/15, Arm NEON intrinsics
# reference, ACLE, ACLE for SVE). Operand-order traps (NEON/SVE fma differ from Intel) are recorded
# in `signature`/`semantics`, so no caller hardcodes an order.
#
# `schedules` uses the matrix's tail names: scalar_remainder (separate tail loop), masked_remainder
# (masked epilogue), full_mask (every iteration masked), sve_intrinsics (explicit predicated SVE
# loops, DaCe's SVEVectorization). Tenstorrent Tensix is absent: no C intrinsic path (design.md).

# --- Loop schedules: what each tail strategy is. Legality per ISA lives in [isa.*].schedules;
# "scalar" is legal everywhere (it is the fallback when nothing vectorizes).

[schedules.scalar]
title = "Scalar loop"
description = "No vectorization: one element per iteration, no tail handling. The baseline every speedup is measured against."
tail = "none"

[schedules.scalar_remainder]
title = "Vector main loop + scalar remainder"
description = "The vectorizer's default shape on maskless ISAs: a full-width main loop while i + VL <= N, then a scalar loop for the last N mod VL elements (AVX2, NEON; AVX-512 may also use it instead of masking)."
tail = "scalar remainder loop after the vector main loop"

[schedules.masked_remainder]
title = "Unmasked main loop + masked epilogue"
description = "AVX-512/SVE shape: the main loop runs unmasked while a whole vector fits; only the final partial iteration is predicated (AVX-512: opmask epilogue; the compiler emits it from vect-partial-vector-usage)."
tail = "masked epilogue (opmask or predicate) after the unmasked main loop"

[schedules.full_mask]
title = "Every iteration masked"
description = "AVX-512 shape: a single loop where every iteration applies its opmask (prefer-predicate-over-epilogue); no separate epilogue at all. Costs a mask per iteration in the main loop."
tail = "every iteration predicated, no epilogue"

[schedules.sve_intrinsics]
title = "Explicit predicated SVE loops"
description = "SVE shape rendered by DaCe's SVEVectorization (the sve_intrinsics tail): the loop steps by svcntd()/svcntw() and svwhilelt builds the tail predicate every iteration, so there is no remainder loop at all. Loop predicates are named __pg_{param}."
tail = "predicate every iteration (svwhilelt), runtime vector length, no remainder"

[isa.avx2]
title = "AVX2 + FMA3 (256-bit VEX)"
vector_bytes = 32
lanes = { f64 = 4, f32 = 8, i64 = 4, i32 = 8, f16 = 16 }
mask = false
schedules = ["scalar", "scalar_remainder"]
gen_mask = ""
note = "No predication: every tail is a remainder loop. Cross-lane ops (vhaddpd, vperm2f128) are slow; keep reductions out of inner loops. Mixing SSE and VEX stalls on old targets: vzeroupper after 256-bit code."

[isa.avx2.f64.load]
intrinsic = "_mm256_loadu_pd"
mnemonic = "vmovupd"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..3"

[isa.avx2.f64.store]
intrinsic = "_mm256_storeu_pd"
mnemonic = "vmovupd"
signature = "(p, v) -> void"
semantics = "p[j] = v[j], j = 0..3"

[isa.avx2.f64.broadcast]
intrinsic = "_mm256_set1_pd"
mnemonic = "vbroadcastsd"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..3"

[isa.avx2.f64.add]
intrinsic = "_mm256_add_pd"
mnemonic = "vaddpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.avx2.f64.sub]
intrinsic = "_mm256_sub_pd"
mnemonic = "vsubpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.avx2.f64.mul]
intrinsic = "_mm256_mul_pd"
mnemonic = "vmulpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.avx2.f64.div]
intrinsic = "_mm256_div_pd"
mnemonic = "vdivpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"
note = "slow (~13 cycles); hoist out of inner loops when the divisor is loop-invariant"

[isa.avx2.f64.fma]
intrinsic = "_mm256_fmadd_pd"
mnemonic = "vfmadd"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j]*b[j] + c[j]"
note = "Intel order: products first, accumulator last; never write it from another ISA's memory"

[isa.avx2.f64.reduce_add]
mnemonic = "vextractf128 + vaddpd + vhaddpd"
signature = "(v) -> s"
semantics = "s = sum of the 4 lanes of v"
recipe = ["_mm256_castpd256_pd128", "_mm256_extractf128_pd", "_mm_add_pd", "_mm_unpackhi_pd", "_mm_add_sd", "_mm_cvtsd_f64"]
note = "no single intrinsic: add the 128-bit halves, then horizontal; lanes 0..3 -> lane 0 -> scalar"

[isa.avx2.f64.zero]
intrinsic = "_mm256_setzero_pd"
mnemonic = "vxorpd"
signature = "() -> v"
semantics = "v[j] = 0.0"

[isa.avx2.f32.load]
intrinsic = "_mm256_loadu_ps"
mnemonic = "vmovups"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..7"

[isa.avx2.f32.store]
intrinsic = "_mm256_storeu_ps"
mnemonic = "vmovups"
signature = "(p, v) -> void"
semantics = "p[j] = v[j], j = 0..7"

[isa.avx2.f32.broadcast]
intrinsic = "_mm256_set1_ps"
mnemonic = "vbroadcastss"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..7"

[isa.avx2.f32.add]
intrinsic = "_mm256_add_ps"
mnemonic = "vaddps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.avx2.f32.sub]
intrinsic = "_mm256_sub_ps"
mnemonic = "vsubps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.avx2.f32.mul]
intrinsic = "_mm256_mul_ps"
mnemonic = "vmulps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.avx2.f32.div]
intrinsic = "_mm256_div_ps"
mnemonic = "vdivps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"
note = "slow; hoist out of inner loops when the divisor is loop-invariant"

[isa.avx2.f32.fma]
intrinsic = "_mm256_fmadd_ps"
mnemonic = "vfmadd"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j]*b[j] + c[j]"
note = "Intel order: products first, accumulator last"

[isa.avx2.f32.reduce_add]
mnemonic = "vextractf128 + vaddps + vmovshdup"
signature = "(v) -> s"
semantics = "s = sum of the 8 lanes of v"
recipe = ["_mm256_castps256_ps128", "_mm256_extractf128_ps", "_mm_add_ps", "_mm_movehdup_ps", "_mm_movehl_ps", "_mm_add_ss", "_mm_cvtss_f32"]
note = "no single intrinsic: add the 128-bit halves, then horizontal; lanes 0..7 -> lane 0 -> scalar"

[isa.avx2.f32.zero]
intrinsic = "_mm256_setzero_ps"
mnemonic = "vxorps"
signature = "() -> v"
semantics = "v[j] = 0.0f"

[isa.avx512]
embedded_broadcast = true
title = "AVX-512F (512-bit EVEX, opmask k0..k7)"
vector_bytes = 64
lanes = { f64 = 8, f32 = 16, i64 = 8, i32 = 16, f16 = 32 }
mask = true
schedules = ["scalar", "scalar_remainder", "masked_remainder", "full_mask"]
gen_mask = "_mm512_cmplt_epu{64,32}_mask(iota, set1(N - i))"
note = "The only x86 target with predication: masked tail forms take a leading __mmask8/16. avx512_256 (the matrix's -mprefer-vector-width=256) is this ISA at 256 bits: same intrinsics, half the lanes. Downclocking risk on some cores is why the width is a sweep knob. EVEX extras: embedded rounding, SAE, embedded broadcast {1to8}."

[isa.avx512.f64.load]
intrinsic = "_mm512_loadu_pd"
masked = "_mm512_maskz_loadu_pd(k, p)"
mnemonic = "vmovupd"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..7"

[isa.avx512.f64.store]
intrinsic = "_mm512_storeu_pd"
masked = "_mm512_mask_storeu_pd(p, k, v)"
mnemonic = "vmovupd"
signature = "(p, v) -> void"
semantics = "p[j] = v[j] for active lanes j"

[isa.avx512.f64.broadcast]
intrinsic = "_mm512_set1_pd"
mnemonic = "vbroadcastsd"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..7"
note = "EVEX embedded broadcast {1to8} folds a broadcast into an arithmetic operand"

[isa.avx512.f64.add]
intrinsic = "_mm512_add_pd"
masked = "_mm512_mask_add_pd(src, k, a, b)"
mnemonic = "vaddpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.avx512.f64.sub]
intrinsic = "_mm512_sub_pd"
masked = "_mm512_mask_sub_pd(src, k, a, b)"
mnemonic = "vsubpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.avx512.f64.mul]
intrinsic = "_mm512_mul_pd"
masked = "_mm512_mask_mul_pd(src, k, a, b)"
mnemonic = "vmulpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.avx512.f64.div]
intrinsic = "_mm512_div_pd"
masked = "_mm512_mask_div_pd(src, k, a, b)"
mnemonic = "vdivpd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"

[isa.avx512.f64.fma]
intrinsic = "_mm512_fmadd_pd"
masked = "_mm512_mask_fmadd_pd(src, k, a, b, c)"
mnemonic = "vfmadd"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j]*b[j] + c[j]"
note = "Intel order: products first, accumulator last"

[isa.avx512.f64.reduce_add]
intrinsic = "_mm512_reduce_add_pd"
mnemonic = "vextractf64x4 + vaddpd + ..."
signature = "(v) -> s"
semantics = "s = sum of the 8 lanes of v"
note = "header composite, not one instruction: shuffle-add chain the compiler expands"

[isa.avx512.f64.zero]
intrinsic = "_mm512_setzero_pd"
mnemonic = "vxorpd"
signature = "() -> v"
semantics = "v[j] = 0.0"

[isa.avx512.f64.gen_mask]
intrinsic = "_mm512_cmplt_epu64_mask"
mnemonic = "vpcmpuq"
signature = "(iota, n) -> k"
semantics = "k bit j set iff iota[j] < n, with iota = _mm512_setr_epi64(0..7), n = N - i"
note = "the standardized gen_mask: element i+offset active iff offset < N - i"

[isa.avx512.f32.load]
intrinsic = "_mm512_loadu_ps"
masked = "_mm512_maskz_loadu_ps(k, p)"
mnemonic = "vmovups"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..15"

[isa.avx512.f32.store]
intrinsic = "_mm512_storeu_ps"
masked = "_mm512_mask_storeu_ps(p, k, v)"
mnemonic = "vmovups"
signature = "(p, v) -> void"
semantics = "p[j] = v[j] for active lanes j"

[isa.avx512.f32.broadcast]
intrinsic = "_mm512_set1_ps"
mnemonic = "vbroadcastss"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..15"
note = "EVEX embedded broadcast {1to16} folds a broadcast into an arithmetic operand"

[isa.avx512.f32.add]
intrinsic = "_mm512_add_ps"
masked = "_mm512_mask_add_ps(src, k, a, b)"
mnemonic = "vaddps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.avx512.f32.sub]
intrinsic = "_mm512_sub_ps"
masked = "_mm512_mask_sub_ps(src, k, a, b)"
mnemonic = "vsubps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.avx512.f32.mul]
intrinsic = "_mm512_mul_ps"
masked = "_mm512_mask_mul_ps(src, k, a, b)"
mnemonic = "vmulps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.avx512.f32.div]
intrinsic = "_mm512_div_ps"
masked = "_mm512_mask_div_ps(src, k, a, b)"
mnemonic = "vdivps"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"

[isa.avx512.f32.fma]
intrinsic = "_mm512_fmadd_ps"
masked = "_mm512_mask_fmadd_ps(src, k, a, b, c)"
mnemonic = "vfmadd"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j]*b[j] + c[j]"
note = "Intel order: products first, accumulator last"

[isa.avx512.f32.reduce_add]
intrinsic = "_mm512_reduce_add_ps"
mnemonic = "vextractf32x8 + vaddps + ..."
signature = "(v) -> s"
semantics = "s = sum of the 16 lanes of v"
note = "header composite, not one instruction: shuffle-add chain the compiler expands"

[isa.avx512.f32.zero]
intrinsic = "_mm512_setzero_ps"
mnemonic = "vxorps"
