[isa.neon]
title = "Arm NEON / AdvSIMD (fixed 128-bit)"
vector_bytes = 16
lanes = { f64 = 2, f32 = 4, i64 = 2, i32 = 4, f16 = 8 }
mask = false
schedules = ["scalar", "scalar_remainder"]
gen_mask = ""
note = "AArch64 baseline (no -m flag). No predication: every tail is a remainder loop. NEON and SVE coexist on one core; gcc --param=aarch64-autovec-preference and clang -mllvm -scalable-vectorization=off gate which the auto-vectorizer prefers. fma availability: vfmaq_f64 (ACLE __ARM_FEATURE_FMA)."

[isa.neon.f64.load]
intrinsic = "vld1q_f64"
mnemonic = "ld1"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..1"

[isa.neon.f64.store]
intrinsic = "vst1q_f64"
mnemonic = "st1"
signature = "(p, v) -> void"
semantics = "p[j] = v[j], j = 0..1"

[isa.neon.f64.broadcast]
intrinsic = "vdupq_n_f64"
mnemonic = "dup"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..1"

[isa.neon.f64.add]
intrinsic = "vaddq_f64"
mnemonic = "fadd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.neon.f64.sub]
intrinsic = "vsubq_f64"
mnemonic = "fsub"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.neon.f64.mul]
intrinsic = "vmulq_f64"
mnemonic = "fmul"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.neon.f64.div]
intrinsic = "vdivq_f64"
mnemonic = "fdiv"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"

[isa.neon.f64.fma]
intrinsic = "vfmaq_f64"
mnemonic = "fmla"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j] + b[j]*c[j]"
note = "operand-order trap: the accumulator is FIRST, the products last (a + b*c) — the opposite of Intel's fmadd"

[isa.neon.f64.reduce_add]
mnemonic = "faddp + fmov"
signature = "(v) -> s"
semantics = "s = sum of the 2 lanes of v"
recipe = ["vpaddq_f64", "vgetq_lane_f64"]
note = "pairwise add (v, v), then extract lane 0: s = vpaddq(v, v)[0]"

[isa.neon.f64.zero]
intrinsic = "vdupq_n_f64"
mnemonic = "movi"
signature = "(0.0) -> v"
semantics = "v[j] = 0.0"

[isa.neon.f32.load]
intrinsic = "vld1q_f32"
mnemonic = "ld1"
signature = "(p) -> v"
semantics = "v[j] = p[j], j = 0..3"

[isa.neon.f32.store]
intrinsic = "vst1q_f32"
mnemonic = "st1"
signature = "(p, v) -> void"
semantics = "p[j] = v[j], j = 0..3"

[isa.neon.f32.broadcast]
intrinsic = "vdupq_n_f32"
mnemonic = "dup"
signature = "(s) -> v"
semantics = "v[j] = s, j = 0..3"

[isa.neon.f32.add]
intrinsic = "vaddq_f32"
mnemonic = "fadd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] + b[j]"

[isa.neon.f32.sub]
intrinsic = "vsubq_f32"
mnemonic = "fsub"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] - b[j]"

[isa.neon.f32.mul]
intrinsic = "vmulq_f32"
mnemonic = "fmul"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] * b[j]"

[isa.neon.f32.div]
intrinsic = "vdivq_f32"
mnemonic = "fdiv"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] / b[j]"

[isa.neon.f32.fma]
intrinsic = "vfmaq_f32"
mnemonic = "fmla"
signature = "(a, b, c) -> v"
semantics = "v[j] = a[j] + b[j]*c[j]"
note = "operand-order trap: the accumulator is FIRST, the products last (a + b*c) — the opposite of Intel's fmadd"

[isa.neon.f32.reduce_add]
intrinsic = "vaddvq_f32"
mnemonic = "addv"
signature = "(v) -> s"
semantics = "s = sum of the 4 lanes of v"
note = "single horizontal-add instruction"

[isa.neon.f32.zero]
intrinsic = "vdupq_n_f32"
mnemonic = "movi"
signature = "(0.0f) -> v"
semantics = "v[j] = 0.0f"

[isa.sve]
title = "Arm SVE (scalable vectors, predicated)"
vector_bytes = 0
lanes = { f64 = 0, f32 = 0, i64 = 0, i32 = 0, f16 = 0 }
mask = true
schedules = ["scalar", "sve_intrinsics"]
gen_mask = "svwhilelt_b{64,32}_u64(i, N)"
note = "Scalable: the vector length is fixed at reset (128..2048 bits, 128-bit steps) and known only at runtime via svcntd()/svcntw() — lanes 0 here mean 'runtime length'. Everything is predicated: every op takes a leading svbool_t pg plus an activity-policy suffix _x (don't-care, fastest), _z (inactive lanes zeroed), _m (inactive lanes from a source operand). The predicate subsumes every tail schedule: no remainder loop. Host flag: -march=armv8-a+sve."

[isa.sve.f64.load]
intrinsic = "svld1_f64"
mnemonic = "ld1d"
signature = "(pg, p) -> v"
semantics = "v[j] = p[j] for active lanes j"

[isa.sve.f64.store]
intrinsic = "svst1_f64"
mnemonic = "st1d"
signature = "(pg, p, v) -> void"
semantics = "p[j] = v[j] for active lanes j"

[isa.sve.f64.broadcast]
intrinsic = "svdup_f64"
mnemonic = "dup"
signature = "(s) -> v"
semantics = "v[j] = s for every lane j"

[isa.sve.f64.add]
intrinsic = "svadd_f64_x"
mnemonic = "fadd"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] + b[j] for active lanes j"
note = "_x policy: fully rewritten values; use _z to zero inactive lanes, _m to merge"

[isa.sve.f64.sub]
intrinsic = "svsub_f64_x"
mnemonic = "fsub"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] - b[j] for active lanes j"

[isa.sve.f64.mul]
intrinsic = "svmul_f64_x"
mnemonic = "fmul"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] * b[j] for active lanes j"

[isa.sve.f64.div]
intrinsic = "svdiv_f64_x"
mnemonic = "fdiv"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] / b[j] for active lanes j"

[isa.sve.f64.fma]
intrinsic = "svmla_f64_x"
mnemonic = "fmla"
signature = "(pg, add, m1, m2) -> v"
semantics = "v[j] = add[j] + m1[j]*m2[j] for active lanes j"
note = "operand-order trap: the accumulator is FIRST (add + m1*m2), like NEON — differs from Intel's fmadd"

[isa.sve.f64.reduce_add]
intrinsic = "svaddv_f64"
mnemonic = "addv"
signature = "(pg, v) -> s"
semantics = "s = sum of the active lanes of v"
note = "cleanest horizontal add of all targets"

[isa.sve.f64.zero]
intrinsic = "svdup_f64"
mnemonic = "mov"
signature = "(0.0) -> v"
semantics = "v[j] = 0.0 for every lane j"

[isa.sve.f64.gen_mask]
intrinsic = "svwhilelt_b64_u64"
mnemonic = "whilelt"
signature = "(i, N) -> pg"
semantics = "lane j active iff i + j < N"
note = "the standardized gen_mask; the loop steps by svcntd() and never needs a remainder loop"

[isa.sve.f32.load]
intrinsic = "svld1_f32"
mnemonic = "ld1w"
signature = "(pg, p) -> v"
semantics = "v[j] = p[j] for active lanes j"

[isa.sve.f32.store]
intrinsic = "svst1_f32"
mnemonic = "st1w"
signature = "(pg, p, v) -> void"
semantics = "p[j] = v[j] for active lanes j"

[isa.sve.f32.broadcast]
intrinsic = "svdup_f32"
mnemonic = "dup"
signature = "(s) -> v"
semantics = "v[j] = s for every lane j"

[isa.sve.f32.add]
intrinsic = "svadd_f32_x"
mnemonic = "fadd"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] + b[j] for active lanes j"
note = "_x policy: fully rewritten values; use _z to zero inactive lanes, _m to merge"

[isa.sve.f32.sub]
intrinsic = "svsub_f32_x"
mnemonic = "fsub"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] - b[j] for active lanes j"

[isa.sve.f32.mul]
intrinsic = "svmul_f32_x"
mnemonic = "fmul"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] * b[j] for active lanes j"

[isa.sve.f32.div]
intrinsic = "svdiv_f32_x"
mnemonic = "fdiv"
signature = "(pg, a, b) -> v"
semantics = "v[j] = a[j] / b[j] for active lanes j"

[isa.sve.f32.fma]
intrinsic = "svmla_f32_x"
mnemonic = "fmla"
signature = "(pg, add, m1, m2) -> v"
semantics = "v[j] = add[j] + m1[j]*m2[j] for active lanes j"
note = "operand-order trap: the accumulator is FIRST (add + m1*m2), like NEON — differs from Intel's fmadd"

[isa.sve.f32.reduce_add]
intrinsic = "svaddv_f32"
mnemonic = "addv"
signature = "(pg, v) -> s"
semantics = "s = sum of the active lanes of v"

[isa.sve.f32.zero]
intrinsic = "svdup_f32"
mnemonic = "mov"
signature = "(0.0f) -> v"
semantics = "v[j] = 0.0f for every lane j"

[isa.sve.f32.gen_mask]
intrinsic = "svwhilelt_b32_u64"
mnemonic = "whilelt"
signature = "(i, N) -> pg"
semantics = "lane j active iff i + j < N"
note = "the standardized gen_mask; the loop steps by svcntw() and never needs a remainder loop"



# --- Transcendentals (exp/sin/cos): no native instruction on the covered ISAs. Each entry lists
# polynomial tiers from [approx] (measured ULP, Horner recipes in abstract-op steps) and the
# vector math library call per veclib (libmvec names verified by nm on glibc 2.43; SLEEF names
# per sleef.org/x86.xhtml and sleef.org/aarch64.xhtml).
[isa.avx2.f64.exp]
signature = "(v) -> v"
semantics = "v[j] = exp(v[j])"
approximations = ["exp-taylor5", "exp-taylor7", "exp-taylor9", "exp-cheb7", "exp-cheb9", "exp-cheb11"]
libraries = { libmvec = "_ZGVcN4v_exp", svml = "_mm256_exp_pd", sleef = "Sleef_expd4_u10" }
note = "no native transcendental on x86, and no reduction assist either (AVX-512 vreducepd/vscalefpd have none here): range-reduce in software, evaluate a tier from [approx], or call a vector math library (the sweep's veclib axis builds exactly these calls); split x = k*ln2 + r first (k = round(x/ln2)); the polynomial approximates exp(r) and the result scales by 2^k - a plain ln2 split loses accuracy for |x| > ~10, hi/lo ln2 constants fix that"

