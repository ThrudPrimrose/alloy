# --- sqrt/min/max/abs/neg/select/mod/gather/scatter under f64/f32; and/or/shl/shr/mod/land/lor
# under i64/i32; the f16 arithmetic subset. Where the hardware lacks an op the entry is a
# recipe over the intrinsics that provide it (the table's fallback story): FP abs/neg are
# AND/XOR sign-mask recipes on x86, scatter is a store+scalar recipe before AVX-512, NEON
# gathers lane-wise, and AVX2 has no f16 arithmetic at all - it converts through f32.
[isa.avx2.f64.sqrt]
intrinsic = "_mm256_sqrt_pd"
mnemonic = "vsqrtpd"
signature = "(v) -> v"
semantics = "v[j] = sqrt(x[j])"

[isa.avx2.f64.min]
intrinsic = "_mm256_min_pd"
mnemonic = "vminpd"
signature = "(a, b) -> v"
semantics = "v[j] = min(a[j], b[j])"
note = "x86 min/max return the second operand when either is NaN (minNum semantics)"

[isa.avx2.f64.max]
intrinsic = "_mm256_max_pd"
mnemonic = "vmaxpd"
signature = "(a, b) -> v"
semantics = "v[j] = max(a[j], b[j])"
note = "x86 min/max return the second operand when either is NaN (minNum semantics)"

[isa.avx2.f64.abs]
mnemonic = "vandpd"
signature = "(v) -> v"
semantics = "v[j] = |x[j]|"
recipe = ["_mm256_castsi256_pd", "_mm256_set1_epi64x", "_mm256_and_pd"]
note = "no native FP abs (integer _mm256_abs_epi* only): AND with 0x7fff... as integer bits"

[isa.avx2.f64.neg]
mnemonic = "vxorpd"
signature = "(v) -> v"
semantics = "v[j] = -x[j]"
recipe = ["_mm256_castsi256_pd", "_mm256_set1_epi64x", "_mm256_xor_pd"]
note = "no native FP neg: XOR with the sign bit (0x8000...) as integer bits"

[isa.avx2.f64.select]
intrinsic = "_mm256_blendv_pd"
mnemonic = "vblendvpd"
signature = "(a, b, mask) -> v"
semantics = "v[j] = signbit(mask[j]) ? b[j] : a[j]"
note = "operand-order trap: mask is LAST and it picks b; blendv tests the mask's SIGN BIT, not ==1 - feed it compare results (all-ones/all-zeros), x86 calls this op blend"

[isa.avx2.f64.mod]
mnemonic = "vdivpd+vroundpd+vfnmadd"
signature = "(a, b) -> v"
semantics = "v[j] = a[j] % b[j] (fmod: sign of a)"
recipe = ["_mm256_div_pd", "_mm256_round_pd", "_mm256_fnmadd_pd"]
note = "no native fmod: q = trunc(a/b) via _mm256_round_{x} with _MM_FROUND_TO_ZERO|_MM_FROUND_NO_EXC, then r = a - q*b; vector fmod calls live in the veclibs"

[isa.avx2.f64.gather]
intrinsic = "_mm256_i64gather_pd"
mnemonic = "vgatherqpd"
signature = "(base, idx) -> v"
semantics = "v[j] = base[idx[j]]"
note = "slow on AMD Zen1/2 (microcoded): affine indices want a plain load"

[isa.avx2.f64.scatter]
mnemonic = "storeu+scalar"
signature = "(base, idx, v) -> void"
semantics = "base[idx[j]] = v[j]"
recipe = ["no vector scatter before AVX-512: _mm256_storeu_pd(v) to a scratch buffer, then scalar per-lane stores; restructure to gather-on-load where possible"]

