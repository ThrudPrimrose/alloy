# --- Polynomial approximation tiers ([approx]): measured against double-precision
# libm on dense grids; error_ulp = max |approx - ref| / spacing(max(|ref|, 1.0)) - ULP at function
# scale, floored so function zeros (cos(pi/2)) stay finite. Taylor tiers use exact Taylor coefficients;
# the quad/cheb tiers are Chebyshev fits (near-minimax) on the reduced domain. The floor of the metric
# is the reference's own 0.5 ulp - higher degrees do not measure better without a wider reference.
[approx.sin-taylor7]
op = "sin"
domain = "|x| <= pi/2 after Cody-Waite reduction"
error_abs = 1.568986e-04
error_ulp = 7.066085e+11
recipe = [
  "t = mul(x, x)",
  "p = fma(-0.0001984126984126984, t, 0.008333333333333333)",
  "p = fma(p, t, -0.16666666666666666)",
  "s = fma(mul(x, t), p, x)",
]
note = "plain Taylor: cheap, inaccurate; the ladder shows why libraries use minimax"

[approx.sin-taylor9]
op = "sin"
domain = "|x| <= pi/2 after Cody-Waite reduction"
error_abs = 3.542584e-06
error_ulp = 1.595438e+10
recipe = [
  "t = mul(x, x)",
  "p = fma(2.7557319223985893e-06, t, -0.0001984126984126984)",
  "p = fma(p, t, 0.008333333333333333)",
  "p = fma(p, t, -0.16666666666666666)",
  "s = fma(mul(x, t), p, x)",
]
note = "plain Taylor: cheap, inaccurate; the ladder shows why libraries use minimax"

[approx.sin-taylor11]
op = "sin"
domain = "|x| <= pi/2 after Cody-Waite reduction"
error_abs = 5.625895e-08
error_ulp = 2.533678e+08
recipe = [
  "t = mul(x, x)",
  "p = fma(-2.505210838544172e-08, t, 2.7557319223985893e-06)",
  "p = fma(p, t, -0.0001984126984126984)",
  "p = fma(p, t, 0.008333333333333333)",
  "p = fma(p, t, -0.16666666666666666)",
  "s = fma(mul(x, t), p, x)",
]
note = "plain Taylor: cheap, inaccurate; the ladder shows why libraries use minimax"

[approx.sin-quad-cheb9]
op = "sin"
domain = "|x| <= pi/4 after quadrant (mod pi/2) reduction"
error_abs = 6.885270e-12
error_ulp = 3.100850e+04
recipe = [
  "t = mul(x, x)",
  "p = fma(2.7173474601211545e-06, t, -0.00019839169723550524)",
  "p = fma(p, t, 0.008333328480625443)",
  "p = fma(p, t, -0.16666666623931767)",
  "p = fma(p, t, 0.999999999991219)",
  "s = mul(x, p)",
]
note = "Chebyshev-fit near-minimax on the quadrant; SLEEF u10 adds double-double reduction for ~1 ulp total"

[approx.sin-quad-cheb13]
op = "sin"
domain = "|x| <= pi/4 after quadrant (mod pi/2) reduction"
error_abs = 1.887379e-15
error_ulp = 8.500000e+00
recipe = [
  "t = mul(x, x)",
  "p = fma(1.779654317759725e-10, t, -2.5085949024166185e-08)",
  "p = fma(p, t, 2.7557559627039636e-06)",
  "p = fma(p, t, -0.00019841270630842274)",
  "p = fma(p, t, 0.008333333334519494)",
  "p = fma(p, t, -0.1666666666667311)",
  "p = fma(p, t, 1.0000000000000024)",
  "s = mul(x, p)",
]
