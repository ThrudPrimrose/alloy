# CUDA and HIP rows of the abstract op set: device-code spellings for one thread (elementwise) or one warp/wavefront
# (cross-lane). Not a SIMD table: a lane is a thread, and a cross-lane op talks to the other threads of its
# warp (32 on NVIDIA, 64 on AMD CDNA, 32 on RDNA). Verdicts come from running each row (alloy/isa/simt.py): a kernel
# of one warp computes the row on every thread and the host compares each thread's value with a C reference.
#
# Inputs: a spans the row's domain, b spans [0.5, 2] in another order, c = 0.25.
# kind: "lane" = an expression of the thread's a, b, c; "warp" = statements that set `out` from the thread's `v`
#        (`lanes` is the warp size, `lane` the thread's index in it); "thread" = statements of one thread on the arrays
#        x (read) and y (written) at its element i, after which the check runs `read` to set `out`.
# A row with a `dtype` other than f32 moves or computes in that type; `spells` names the request op it answers.
# ref: the host's C reference: an expression of a, b, c for "lane"; statements setting `want[j]` for "warp".
# tol: maximum relative error against the reference (0 = exact).

[target.cuda]
title = "CUDA (NVIDIA, warp of 32)"
compiler = "nvcc"
headers = ["cuda_fp16.h", "cuda_bf16.h"]
note = "Cross-lane intrinsics take a member mask first (__shfl_down_sync(0xffffffff, v, d)); the non-_sync forms were deprecated in CUDA 9 and are unavailable on sm_70 and newer. Fast-math intrinsics (__expf, __sinf, __fdividef) are what -use_fast_math turns expf/sinf/a/b into; they trade accuracy for a special-function-unit instruction."

[target.hip]
title = "HIP (AMD, wavefront of 64 on CDNA)"
compiler = "hipcc"
headers = ["hip/hip_fp16.h", "hip/hip_bf16.h"]
note = "Cross-lane intrinsics take no mask (__shfl_down(v, d)) and the wavefront is 64 lanes on CDNA (MI200, MI300), so a reduction loops from warpSize/2, not 16; __ballot returns a 64-bit mask. Floating-point atomics on global memory need -munsafe-fp-atomics to become hardware atomics on CDNA; without it they are a compare-and-swap loop."

[ops.fma]
kind = "lane"
cuda = "fmaf(a, b, c)"
hip = "fmaf(a, b, c)"
ref = "fmaf(a, b, c)"
tol = 0.0

[ops.exp_fast]
kind = "lane"
cuda = "__expf(a)"
hip = "__expf(a)"
ref = "expf(a)"
tol = 1e-5
note = "The special-function unit's exp: about 2 ulp near 0 and growing with |a| on CUDA; expf is the accurate call."

[ops.sin_fast]
kind = "lane"
cuda = "__sinf(a)"
hip = "__sinf(a)"
ref = "sinf(a)"
tol = 1e-5
note = "Accurate to about 2^-21.4 absolute for |a| <= pi; outside, error grows with |a| (no full range reduction)."

[ops.div_fast]
kind = "lane"
cuda = "__fdividef(a, b)"
hip = "__fdividef(a, b)"
ref = "a / b"
tol = 1e-6

[ops.rsqrt]
kind = "lane"
cuda = "rsqrtf(a)"
hip = "rsqrtf(a)"
ref = "1.0f / sqrtf(a)"
tol = 1e-6
domain = [0.5, 4.0]

[ops.reduce_add]
kind = "warp"
cuda = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out += __shfl_down_sync(0xffffffffu, out, d);"
hip = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out += __shfl_down(out, d);"
ref = "float s = 0; for (int k = 0; k < lanes; k++) s += in[k]; want[0] = s;"
check = "first"
tol = 1e-6
domain = [0.5, 4.0]  # not symmetric: a sum of zero would equal the untouched output
note = "The sum lands in lane 0; the other lanes hold partial sums. Use __shfl_xor for the sum in every lane."

[ops.reduce_min]
kind = "warp"
cuda = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out = fminf(out, __shfl_down_sync(0xffffffffu, out, d));"
hip = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out = fminf(out, __shfl_down(out, d));"
ref = "float s = in[0]; for (int k = 1; k < lanes; k++) s = fminf(s, in[k]); want[0] = s;"
check = "first"
tol = 0.0
domain = [4.0, 0.5]  # descending: the minimum sits in the last lane and has to travel the whole tree
note = "The minimum lands in lane 0; fminf returns the other operand when one is NaN. Use __shfl_xor for it in every lane."

[ops.reduce_max]
kind = "warp"
cuda = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out = fmaxf(out, __shfl_down_sync(0xffffffffu, out, d));"
hip = "out = v; for (int d = lanes / 2; d > 0; d /= 2) out = fmaxf(out, __shfl_down(out, d));"
ref = "float s = in[0]; for (int k = 1; k < lanes; k++) s = fmaxf(s, in[k]); want[0] = s;"
check = "first"
tol = 0.0
domain = [0.5, 4.0]  # the maximum sits in the last lane: it has to travel the whole tree
note = "The maximum lands in lane 0; fmaxf returns the other operand when one is NaN. Use __shfl_xor for it in every lane."

[ops.scan_add]
kind = "warp"
cuda = "out = v; for (int d = 1; d < lanes; d *= 2) { float t = __shfl_up_sync(0xffffffffu, out, d); if (lane >= d) out += t; }"
hip = "out = v; for (int d = 1; d < lanes; d *= 2) { float t = __shfl_up(out, d); if (lane >= d) out += t; }"
ref = "float s = 0; for (int k = 0; k < lanes; k++) { s += in[k]; want[k] = s; }"
tol = 1e-6
domain = [0.5, 4.0]
note = "The inclusive prefix sum over the warp in log2(lanes) steps (Hillis and Steele); lane k holds in[0] + ... + in[k], summed in another order than a left fold. Across warps, add the last lane of the warp before."

[ops.broadcast]
kind = "warp"
cuda = "out = __shfl_sync(0xffffffffu, v, 0);"
hip = "out = __shfl(v, 0);"
ref = "for (int k = 0; k < lanes; k++) want[k] = in[0];"
tol = 0.0

[ops.ballot_count]
kind = "warp"
cuda = "out = (float)__popc(__ballot_sync(0xffffffffu, v > 0.0f));"
hip = "out = (float)__popcll(__ballot(v > 0.0f));"
ref = "int n = 0; for (int k = 0; k < lanes; k++) n += in[k] > 0.0f; for (int k = 0; k < lanes; k++) want[k] = (float)n;"
tol = 0.0
domain = [-1.0, 3.0]  # a quarter of the lanes negative: an inverted predicate counts differently
note = "The number of lanes whose predicate holds, in every lane. The ballot is a 32-bit mask on CUDA and a 64-bit one on HIP: count it with __popc or __popcll. Not the CPU tail mask (gen_mask): a GPU loop tail is a per-thread bounds check."

[ops.add_half2]
kind = "lane"
cuda = "[&] { __half2 h = __hadd2(__floats2half2_rn(a, b), __floats2half2_rn(c, a)); return __low2float(h) + 2.0f * __high2float(h); }()"
hip = "[&] { __half2 h = __hadd2(__floats2half2_rn(a, b), __floats2half2_rn(c, a)); return __low2float(h) + 2.0f * __high2float(h); }()"
ref = "(a + c) + 2.0f * (b + a)"
tol = 2e-3
dtype = "f16"
note = "Two f16 additions in one instruction: the low halves (a + c) and the high halves (b + a); the check reads both. The result is f16, so expect 2^-11 relative error; the check's inputs are exact in f16."

[ops.load_wide]
kind = "lane"
cuda = "reinterpret_cast<const float4*>(wide)[lane / 4].x"
hip = "reinterpret_cast<const float4*>(wide)[lane / 4].x"
ref = "wide_ref(k)"
tol = 0.0
note = "Reads only .x of a float4, so the compiler narrows it to one 4-byte load (LDG.E on sm_90, global_load_dword on gfx942, read from the compiled row); use all four components for one 16-byte LDG.E.128 / global_load_dwordx4, from a 16-byte aligned pointer."

[ops.atomic_add]
kind = "warp"
cuda = "atomicAdd(total, v); __syncwarp(); out = *total;"
hip = "atomicAdd(total, v); __syncthreads(); out = *total;"
ref = "float s = 0; for (int k = 0; k < lanes; k++) s += in[k]; want[0] = s;"
check = "first"
tol = 1e-6
domain = [0.5, 4.0]
note = "Floating-point atomicAdd on global memory; on HIP/CDNA compile with -munsafe-fp-atomics for a hardware atomic."

[ops.load_f16]
spells = "load"
kind = "lane"
cuda = "__half2float(x[i])"
hip = "__half2float(x[i])"
ref = "a"
tol = 0.0
dtype = "f16"
note = "One f16 element loaded and widened to float. The check's inputs are exact in f16."

[ops.store_f16]
spells = "store"
kind = "thread"
cuda = "y[i] = __float2half_rn(a);"
hip = "y[i] = __float2half_rn(a);"
read = "out = __half2float(y[i]);"
ref = "a"
tol = 0.0
dtype = "f16"
note = "A float rounded to the nearest f16 and stored. The check reads it back."

[ops.load_x2_f16]
spells = "load_x2"
kind = "thread"
cuda = "float2 f = __half22float2(reinterpret_cast<const __half2*>(x)[i / 2]);"
hip = "float2 f = __half22float2(reinterpret_cast<const __half2*>(x)[i / 2]);"
read = "out = i % 2 ? f.y : f.x;"
ref = "a"
tol = 0.0
dtype = "f16"
note = "Two f16 in one 4-byte load, widened to a float2 (x = element 2j, y = 2j + 1); x 4-byte aligned."

[ops.store_x2_f16]
spells = "store_x2"
kind = "thread"
cuda = "reinterpret_cast<__half2*>(y)[i] = __floats2half2_rn(a, b);"
hip = "reinterpret_cast<__half2*>(y)[i] = __floats2half2_rn(a, b);"
read = "out = __half2float(y[2 * i]) + 2.0f * __half2float(y[2 * i + 1]);"
ref = "a + 2.0f * b"
tol = 0.0
dtype = "f16"
note = "Two floats rounded to f16 and stored in one 4-byte store (a at 2i, b at 2i + 1); y 4-byte aligned."

[ops.load_wide_f16]
spells = "load_wide"
kind = "thread"
cuda = "uint4 q = reinterpret_cast<const uint4*>(x)[i / 8];"
hip = "uint4 q = reinterpret_cast<const uint4*>(x)[i / 8];"
read = "out = __half2float(reinterpret_cast<const elem*>(&q)[i % 8]);"
ref = "a"
tol = 0.0
dtype = "f16"
note = "Eight f16 in one 16-byte load (LDG.E.128 on sm_90, global_load_dwordx4 on CDNA, read from the compiled row); unpack q as f16[8]; x 16-byte aligned."

[ops.store_wide_f16]
spells = "store_wide"
kind = "thread"
cuda = "uint4 q; __half* e = reinterpret_cast<__half*>(&q); for (int j = 0; j < 8; j++) e[j] = __float2half_rn(a + j); reinterpret_cast<uint4*>(y)[i] = q;"
hip = "uint4 q; __half* e = reinterpret_cast<__half*>(&q); for (int j = 0; j < 8; j++) e[j] = __float2half_rn(a + j); reinterpret_cast<uint4*>(y)[i] = q;"
read = "out = __half2float(y[8 * i]) + 2.0f * __half2float(y[8 * i + 7]);"
ref = "a + 2.0f * (a + 7.0f)"
tol = 0.0
dtype = "f16"
note = "Eight f16 packed into a uint4 and stored with one 16-byte store (here the values a .. a + 7); y 16-byte aligned."

[ops.load_bf16]
spells = "load"
kind = "lane"
cuda = "__bfloat162float(x[i])"
hip = "__bfloat162float(x[i])"
ref = "a"
tol = 0.0
dtype = "bf16"
note = "One bf16 element loaded and widened to float. The check's inputs are exact in bf16."

[ops.store_bf16]
spells = "store"
kind = "thread"
cuda = "y[i] = __float2bfloat16_rn(a);"
hip = "y[i] = __float2bfloat16(a);"
read = "out = __bfloat162float(y[i]);"
ref = "a"
tol = 0.0
dtype = "bf16"
note = "A float rounded to the nearest bf16 and stored. The check reads it back."

[ops.load_x2_bf16]
spells = "load_x2"
kind = "thread"
cuda = "float2 f = __bfloat1622float2(reinterpret_cast<const __nv_bfloat162*>(x)[i / 2]);"
hip = "float2 f = __bfloat1622float2(reinterpret_cast<const __hip_bfloat162*>(x)[i / 2]);"
read = "out = i % 2 ? f.y : f.x;"
ref = "a"
tol = 0.0
dtype = "bf16"
note = "Two bf16 in one 4-byte load, widened to a float2 (x = element 2j, y = 2j + 1); x 4-byte aligned."

[ops.store_x2_bf16]
spells = "store_x2"
kind = "thread"
cuda = "reinterpret_cast<__nv_bfloat162*>(y)[i] = __floats2bfloat162_rn(a, b);"
hip = "reinterpret_cast<__hip_bfloat162*>(y)[i] = __float22bfloat162_rn(make_float2(a, b));"
read = "out = __bfloat162float(y[2 * i]) + 2.0f * __bfloat162float(y[2 * i + 1]);"
ref = "a + 2.0f * b"
tol = 0.0
dtype = "bf16"
note = "Two floats rounded to bf16 and stored in one 4-byte store (a at 2i, b at 2i + 1); y 4-byte aligned."

[ops.load_wide_bf16]
spells = "load_wide"
kind = "thread"
cuda = "uint4 q = reinterpret_cast<const uint4*>(x)[i / 8];"
hip = "uint4 q = reinterpret_cast<const uint4*>(x)[i / 8];"
read = "out = __bfloat162float(reinterpret_cast<const elem*>(&q)[i % 8]);"
ref = "a"
tol = 0.0
dtype = "bf16"
note = "Eight bf16 in one 16-byte load (LDG.E.128 on sm_90, global_load_dwordx4 on CDNA, read from the compiled row); unpack q as bf16[8]; x 16-byte aligned."

[ops.store_wide_bf16]
spells = "store_wide"
kind = "thread"
cuda = "uint4 q; __nv_bfloat16* e = reinterpret_cast<__nv_bfloat16*>(&q); for (int j = 0; j < 8; j++) e[j] = __float2bfloat16_rn(a + j); reinterpret_cast<uint4*>(y)[i] = q;"
hip = "uint4 q; __hip_bfloat16* e = reinterpret_cast<__hip_bfloat16*>(&q); for (int j = 0; j < 8; j++) e[j] = __float2bfloat16(a + j); reinterpret_cast<uint4*>(y)[i] = q;"
read = "out = __bfloat162float(y[8 * i]) + 2.0f * __bfloat162float(y[8 * i + 7]);"
ref = "a + 2.0f * (a + 7.0f)"
tol = 0.0
dtype = "bf16"
note = "Eight bf16 packed into a uint4 and stored with one 16-byte store (here the values a .. a + 7); y 16-byte aligned."
