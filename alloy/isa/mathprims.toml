# Spellings of the primitives the math kernels are written in (mathkernels.toml). Each ISA gives one
# template per primitive; $0 $1 $2 are the operands and ${name} a per-dtype field. A dtype table may
# override any primitive. Identifier-shaped spellings are header-checked by tests/test_isa_kernels.py.

[prims.avx512.fields.f64]
vec = "__m512d"
ivec = "__m512i"
mask = "__mmask8"
c = "double"
s = "pd"
e = "epi64"
full = "0xff"
lanes = "8"

[prims.avx512.fields.f32]
vec = "__m512"
ivec = "__m512i"
mask = "__mmask16"
c = "float"
s = "ps"
e = "epi32"
full = "0xffff"
lanes = "16"

[prims.avx512.ops]
set = "_mm512_set1_${s}($0)"
seti = "_mm512_set1_${e}($0)"
load = "_mm512_loadu_${s}($0)"
store = "_mm512_storeu_${s}($0, $1)"
add = "_mm512_add_${s}($0, $1)"
sub = "_mm512_sub_${s}($0, $1)"
mul = "_mm512_mul_${s}($0, $1)"
div = "_mm512_div_${s}($0, $1)"
fma = "_mm512_fmadd_${s}($0, $1, $2)"
fms = "_mm512_fmsub_${s}($0, $1, $2)"
fnma = "_mm512_fnmadd_${s}($0, $1, $2)"
sqrt = "_mm512_sqrt_${s}($0)"
abs = "_mm512_abs_${s}($0)"
neg = "_mm512_xor_${s}($0, _mm512_set1_${s}(-0.0))"
round = "_mm512_roundscale_${s}($0, 8)"
toint = "_mm512_cvt${s}_${e}($0)"
tofloat = "_mm512_cvt${e}_${s}($0)"
bits = "_mm512_cast${s}_si512($0)"
frombits = "_mm512_castsi512_${s}($0)"
iadd = "_mm512_add_${e}($0, $1)"
isub = "_mm512_sub_${e}($0, $1)"
iand = "_mm512_and_si512($0, $1)"
ior = "_mm512_or_si512($0, $1)"
ixor = "_mm512_xor_si512($0, $1)"
ishl = "_mm512_slli_${e}($0, $1)"
ishr = "_mm512_srli_${e}($0, $1)"
le = "_mm512_cmp_${s}_mask($0, $1, _CMP_LE_OQ)"
lt = "_mm512_cmp_${s}_mask($0, $1, _CMP_LT_OQ)"
eq = "_mm512_cmp_${s}_mask($0, $1, _CMP_EQ_OQ)"
mand = "($0 & $1)"
mor = "($0 | $1)"
select = "_mm512_mask_blend_${s}($0, $2, $1)"
allok = "(($0) == ${full})"

[prims.avx2.fields.f64]
vec = "__m256d"
ivec = "__m256i"
mask = "__m256d"
c = "double"
s = "pd"
e = "epi64"
seti = "_mm256_set1_epi64x"
full = "0xf"
lanes = "4"

[prims.avx2.fields.f32]
vec = "__m256"
ivec = "__m256i"
mask = "__m256"
c = "float"
s = "ps"
e = "epi32"
seti = "_mm256_set1_epi32"
full = "0xff"
lanes = "8"

[prims.avx2.ops]
set = "_mm256_set1_${s}($0)"
seti = "${seti}($0)"
load = "_mm256_loadu_${s}($0)"
store = "_mm256_storeu_${s}($0, $1)"
add = "_mm256_add_${s}($0, $1)"
sub = "_mm256_sub_${s}($0, $1)"
mul = "_mm256_mul_${s}($0, $1)"
div = "_mm256_div_${s}($0, $1)"
fma = "_mm256_fmadd_${s}($0, $1, $2)"
fms = "_mm256_fmsub_${s}($0, $1, $2)"
fnma = "_mm256_fnmadd_${s}($0, $1, $2)"
sqrt = "_mm256_sqrt_${s}($0)"
abs = "_mm256_andnot_${s}(_mm256_set1_${s}(-0.0), $0)"
neg = "_mm256_xor_${s}($0, _mm256_set1_${s}(-0.0))"
round = "_mm256_round_${s}($0, _MM_FROUND_TO_NEAREST_INT | _MM_FROUND_NO_EXC)"
toint = "_mm256_cvt${s}_${e}($0)"
tofloat = "_mm256_cvt${e}_${s}($0)"
bits = "_mm256_cast${s}_si256($0)"
frombits = "_mm256_castsi256_${s}($0)"
iadd = "_mm256_add_${e}($0, $1)"
isub = "_mm256_sub_${e}($0, $1)"
iand = "_mm256_and_si256($0, $1)"
ior = "_mm256_or_si256($0, $1)"
ixor = "_mm256_xor_si256($0, $1)"
ishl = "_mm256_slli_${e}($0, $1)"
ishr = "_mm256_srli_${e}($0, $1)"
le = "_mm256_cmp_${s}($0, $1, _CMP_LE_OQ)"
lt = "_mm256_cmp_${s}($0, $1, _CMP_LT_OQ)"
eq = "_mm256_cmp_${s}($0, $1, _CMP_EQ_OQ)"
mand = "_mm256_and_${s}($0, $1)"
mor = "_mm256_or_${s}($0, $1)"
select = "_mm256_blendv_${s}($2, $1, $0)"
allok = "(_mm256_movemask_${s}($0) == ${full})"

# AVX2 has no f64<->i64 conversion: a value with |v| < 2^51 converts through the 2^52 + 2^51 bias.
[prims.avx2.overrides.f64]
toint = "_mm256_sub_epi64(_mm256_castpd_si256(_mm256_add_pd($0, _mm256_set1_pd(0x1.8p52))), _mm256_castpd_si256(_mm256_set1_pd(0x1.8p52)))"
tofloat = "_mm256_sub_pd(_mm256_castsi256_pd(_mm256_add_epi64($0, _mm256_castpd_si256(_mm256_set1_pd(0x1.8p52)))), _mm256_set1_pd(0x1.8p52))"

[prims.neon.fields.f64]
vec = "float64x2_t"
ivec = "int64x2_t"
mask = "uint64x2_t"
c = "double"
f = "f64"
i = "s64"
u = "u64"
lanes = "2"

[prims.neon.fields.f32]
vec = "float32x4_t"
ivec = "int32x4_t"
mask = "uint32x4_t"
c = "float"
f = "f32"
i = "s32"
u = "u32"
lanes = "4"

[prims.neon.ops]
set = "vdupq_n_${f}($0)"
seti = "vdupq_n_${i}($0)"
load = "vld1q_${f}($0)"
store = "vst1q_${f}($0, $1)"
add = "vaddq_${f}($0, $1)"
sub = "vsubq_${f}($0, $1)"
mul = "vmulq_${f}($0, $1)"
div = "vdivq_${f}($0, $1)"
fma = "vfmaq_${f}($2, $0, $1)"
fms = "vnegq_${f}(vfmsq_${f}($2, $0, $1))"
fnma = "vfmsq_${f}($2, $0, $1)"
sqrt = "vsqrtq_${f}($0)"
abs = "vabsq_${f}($0)"
neg = "vnegq_${f}($0)"
round = "vrndnq_${f}($0)"
toint = "vcvtnq_${i}_${f}($0)"
tofloat = "vcvtq_${f}_${i}($0)"
bits = "vreinterpretq_${i}_${f}($0)"
frombits = "vreinterpretq_${f}_${i}($0)"
iadd = "vaddq_${i}($0, $1)"
isub = "vsubq_${i}($0, $1)"
iand = "vandq_${i}($0, $1)"
ior = "vorrq_${i}($0, $1)"
ixor = "veorq_${i}($0, $1)"
ishl = "vshlq_n_${i}($0, $1)"
ishr = "vreinterpretq_${i}_${u}(vshrq_n_${u}(vreinterpretq_${u}_${i}($0), $1))"
le = "vcleq_${f}($0, $1)"
lt = "vcltq_${f}($0, $1)"
eq = "vceqq_${f}($0, $1)"
mand = "vandq_${u}($0, $1)"
mor = "vorrq_${u}($0, $1)"
select = "vbslq_${f}($0, $1, $2)"
allok = "(vminvq_u32(vreinterpretq_u32_u64($0)) == 0xffffffffu)"

[prims.neon.overrides.f32]
allok = "(vminvq_u32($0) == 0xffffffffu)"

[prims.sve.fields.f64]
vec = "svfloat64_t"
ivec = "svint64_t"
mask = "svbool_t"
c = "double"
f = "f64"
i = "s64"
u = "u64"
p = "svptrue_b64()"
lanes = "svcntd()"

[prims.sve.fields.f32]
vec = "svfloat32_t"
ivec = "svint32_t"
mask = "svbool_t"
c = "float"
f = "f32"
i = "s32"
u = "u32"
p = "svptrue_b32()"
lanes = "svcntw()"

[prims.sve.ops]
set = "svdup_${f}($0)"
seti = "svdup_${i}($0)"
load = "svld1_${f}(${p}, $0)"
store = "svst1_${f}(${p}, $0, $1)"
add = "svadd_${f}_x(${p}, $0, $1)"
sub = "svsub_${f}_x(${p}, $0, $1)"
mul = "svmul_${f}_x(${p}, $0, $1)"
div = "svdiv_${f}_x(${p}, $0, $1)"
fma = "svmla_${f}_x(${p}, $2, $0, $1)"
fms = "svnmls_${f}_x(${p}, $2, $0, $1)"
fnma = "svmls_${f}_x(${p}, $2, $0, $1)"
sqrt = "svsqrt_${f}_x(${p}, $0)"
abs = "svabs_${f}_x(${p}, $0)"
neg = "svneg_${f}_x(${p}, $0)"
round = "svrintn_${f}_x(${p}, $0)"
toint = "svcvt_${i}_${f}_x(${p}, $0)"
tofloat = "svcvt_${f}_${i}_x(${p}, $0)"
bits = "svreinterpret_${i}_${f}($0)"
frombits = "svreinterpret_${f}_${i}($0)"
iadd = "svadd_${i}_x(${p}, $0, $1)"
isub = "svsub_${i}_x(${p}, $0, $1)"
iand = "svand_${i}_x(${p}, $0, $1)"
ior = "svorr_${i}_x(${p}, $0, $1)"
ixor = "sveor_${i}_x(${p}, $0, $1)"
ishl = "svlsl_n_${i}_x(${p}, $0, $1)"
ishr = "svreinterpret_${i}_${u}(svlsr_n_${u}_x(${p}, svreinterpret_${u}_${i}($0), $1))"
le = "svcmple_${f}(${p}, $0, $1)"
lt = "svcmplt_${f}(${p}, $0, $1)"
eq = "svcmpeq_${f}(${p}, $0, $1)"
mand = "svand_b_z(${p}, $0, $1)"
mor = "svorr_b_z(${p}, $0, $1)"
select = "svsel_${f}($0, $1, $2)"
allok = "(!svptest_any(${p}, svnot_b_z(${p}, $0)))"
