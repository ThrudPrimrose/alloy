# Alloy configuration matrix: every compiler, flag and codegen option the sweep tries.
# Loaded and checked by alloy/configuration_matrix.py; pass another file with `alloy build --matrix`.
# Code only enumerates this matrix and gates it: vector libraries open for regions that call one of
# `libm_calls`, and an FP level with `need_reduction = true` opens only for regions that reduce.

# Flags every candidate compiles with.
base_flags = ["-O3", "-march=native", "-fopenmp", "-fPIC"]

# libm calls a vector math library can replace. sqrt/fabs/fma are single instructions and need none.
libm_calls = [
    "sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh",
    "exp", "exp2", "expm1", "log", "log2", "log10", "log1p", "pow", "cbrt", "erf", "erfc",
]

# FP level a vector-library candidate builds at: a vector libm call needs errno off.
veclib_fp_level = "noerrno"

[languages.c]
std_flag = "-std=c23"
suffix = "c"

[languages."c++"]
std_flag = "-std=c++20"
suffix = "cpp"

[compilers.gcc]
executables = { c = "gcc", "c++" = "g++" }
remark_flags = ["-fopt-info-vec-optimized", "-fopt-info-vec-missed"]
# glibc declares the libmvec simd variants of sin/cos/... only under __FAST_MATH__.
veclib_flags = { libmvec = ["-fopenmp-simd", "-ffast-math"] }

# clang 22 has no libomp-22-dev on the development box, so clang 21.
[compilers.clang]
executables = { c = "clang-21", "c++" = "clang++-21" }
remark_flags = ["-Rpass=loop-vectorize", "-Rpass-missed=loop-vectorize", "-Rpass-analysis=loop-vectorize"]
veclib_flags = { libmvec = ["-fveclib=libmvec", "-fno-math-errno"], sleef = ["-fveclib=SLEEF", "-fno-math-errno"] }

# Library name the linker must find (ctypes.util.find_library) for a vector math library to be offered.
[veclib_probes]
libmvec = "mvec"
sleef = "sleefgnuabi"

# The first level is the reference every other level is verified against.
[fp_levels.strict]
flags = ["-ffp-contract=off"]

[fp_levels.contract]
flags = ["-ffp-contract=fast"]

[fp_levels.noerrno]
flags = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math"]

[fp_levels.reassoc]
flags = ["-ffp-contract=fast", "-fno-math-errno", "-fno-trapping-math", "-fassociative-math", "-fno-signed-zeros"]
need_reduction = true  # reassociation changes code only where something reduces

# Readable-codegen knobs (compiler.cpu.codegen_params); the first value is DaCe's default.
[knobs]
loop_access_form = ["indexed", "ptr_increment"]
heap_ptr_restrict = ["restrict", "none"]
const_scalar_abi = ["by_ref", "by_value"]
decl_placement = ["eager", "late"]
scalar_init_style = ["split", "fused"]

# Index width moves as one axis: int32 helpers under int64 counters cost gcc its vectorization
# (samples/index_width), so only matched pairs are candidates. The first entry is the default.
[index_widths.int64]
index_ctype = "int64"
loop_index_type = "inferred"

[index_widths.int32]
index_ctype = "int32"
loop_index_type = "int32"
