line-length = 120
target-version = "py312"

[lint]
select = ["ANN", "F", "UP", "I", "FLY", "Q", "C4", "C90", "DTZ", "T10", "EXE", "INT", "ISC", "PYI", "RSE", "TID", "W", "PERF", "FURB", "RUF100"]
ignore = ["UP031","C408","PYI041","PYI042","PYI016","PERF203","FURB136"]

# Cyclomatic complexity at most 15 (cognitive: complexipy in pre-commit); the functions over it on 2026-11-23 carry
# `# noqa: C901` until they are refactored, and RUF100 flags each one that no longer needs it.
[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "I"]
# Test doubles stand in for real objects by duck typing.
"tests/*" = ["ANN401"]
# The card judge and row harness of the Tenstorrent study, frozen at the 11-19 freeze (agents/tensix/export.sh copies
# them to alloy-tenstorrent verbatim); the architecture file is generated (python -m alloy.isa.softhier arch).
"agents/tensix/agents/host.py" = ["ANN", "F841"]
"agents/tensix/rows/*" = ["ANN"]
"agents/softhier/alloy_v1.py" = ["ANN"]

[format]
exclude = ["*.ipynb", "*.md", "agents/softhier/alloy_v1.py"]  # generated: skill pages, the SoftHier arch file
