# HPCAgent-Bench manifest schema: the paper's running example, the 64 x 64 x 64 tile, fuzzed around it for checking.
name: GEMM 64
level: 1
parameters:
  S:
    NI: 64
    NJ: 64
    NK: 64
  fuzzed:
    NI: [32, 128]
    NJ: [32, 128]
    NK: [32, 128]
args:
  alpha: {value: 1.5, dtype: float32}  # PolyBench gemm
  beta: {value: 1.2, dtype: float32}
  C: {shape: "(NI, NJ)", dtype: float32, out: true}
  A: {shape: "(NI, NK)", dtype: float32}
  B: {shape: "(NK, NJ)", dtype: float32}
