# HPCAgent-Bench manifest schema: the paper's running example, the 64 x 64 x 64 tile, fuzzed around it for checking.
name: GEMM 64
level: 1
parameters:
  S:
    NI: 64
    NJ: 64
    NK: 64
  fuzzed:
    NI: [32, 128]
    NJ: [32, 128]
    NK: [32, 128]
args:
  alpha: {value: 1.5}  # PolyBench gemm; draw at float32 (inputs.load(..., datatype="float32"))
  beta: {value: 1.2}
  C: {shape: "(NI, NJ)", out: true}
  A: (NI, NK)
  B: (NK, NJ)
