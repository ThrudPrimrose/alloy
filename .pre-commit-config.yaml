# Setup: uv sync --extra dev && pre-commit install
# Every file: pre-commit run --all-files
# Recorded agent outputs and the card's row file stay verbatim (alloy-tenstorrent exports them byte for byte).
exclude: ^agents/tensix/(agents/(submissions|probes|reference|generated|stock)/|rows/rows\.json$)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^alloy/hb_plugin/skills/docs-md-  # a vendor manual's chapter, written by alloy.hb_plugin.pages
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Cognitive complexity at most 15 (cyclomatic: ruff C901); complexipy-snapshot.json holds the functions over it on
      # 2026-11-23, which may only get simpler until they are refactored.
      - id: complexipy
        name: complexipy
        entry: uvx complexipy==9.0.0 . --max-complexity-allowed 15 --quiet
        language: system
        pass_filenames: false
        types: [python]
