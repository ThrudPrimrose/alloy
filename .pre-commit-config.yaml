# Setup: uv sync --extra dev && pre-commit install
# Every file: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^alloy/hb_plugin/skills/docs-md-  # a vendor manual's chapter, written by alloy.hb_plugin.pages
      - id: end-of-file-fixer
      - id: trailing-whitespace
