name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a failing stage of a piped step fails the step
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Strict static typing (pyproject.toml [tool.mypy] and [tool.pyright]) over the package, tests and helpers
      - run: uv run pyright
      - run: uv run mypy alloy tests helpers

  # Every compiler of configuration_matrix.toml on one runner, so the OpenMP interop test links objects from all of
  # them into one binary against each runtime (libomp, libgomp, libnvomp).
  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NVHPC_VERSION: "26.3"
      LLVM_VERSION: "21"
      GCC_VERSION: "14"  # first gcc that takes -std=c23
    steps:
      - uses: actions/checkout@v4

      # What HPCAgent-Bench's judge needs on the runner for the hb_plugin end-to-end tests: its grading seal enters an
      # unprivileged user namespace (ubuntu-24.04 restricts that through AppArmor) and /profile reads perf events.
      - name: Grading seal and perf events
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
          sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Free disk for the HPC SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: gcc
        run: |
          # The runner's mirror list names Canonical hosts only; when their DNS is down no job installs anything.
          echo -e 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:9' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          # OpenBLAS + LAPACKE: the BLAS/LAPACK library-node headers a scope includes (OMEN's Norb-sized products)
          sudo apt-get install -y gcc-$GCC_VERSION g++-$GCC_VERSION libopenblas-dev liblapacke-dev ninja-build gcc-14-aarch64-linux-gnu qemu-user
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$GCC_VERSION 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-$GCC_VERSION 100
          # SME tiles call the SME ABI routines (__arm_tpidr2_save), which libgcc has from gcc 14
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-14 100
          # SLEEF shared and static: a scope that picks it links a private copy from libsleefgnuabi.a (A7)
          sudo JOBS="$(nproc)" helpers/install-sleef.sh /usr/local

      - name: clang + LLVM libomp
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh $LLVM_VERSION
          sudo apt-get install -y libomp-$LLVM_VERSION-dev
          # the runner image ships an older /usr/bin/clang without libomp; this LLVM's bin dir goes first on PATH
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Intel oneAPI (icx)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp
          source /opt/intel/oneapi/setvars.sh
          echo "$(dirname "$(command -v icx)")" >> "$GITHUB_PATH"

      - name: NVIDIA HPC SDK (nvc)
        run: |
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
            | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /" \
            | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update
          sudo apt-get install -y nvhpc-${NVHPC_VERSION//./-}
          echo "/opt/nvidia/hpc_sdk/Linux_x86_64/$NVHPC_VERSION/compilers/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          clang --version | head -1
          icx --version | head -1
          nvc --version | sed -n 2p

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev

      # Every host compiler is on PATH here; deselected are the host-ISA mark on a runner without AVX-512 (the rows it
      # cannot run still compile, every runner) and the GPU toolkit marks (no nvcc or hipcc on hosted runners).
      # The OpenMP launch environment HPCAgent-Bench's judge requires before numpy loads (flags.openmp_launch_env).
      - name: Tests
        run: |
          ulimit -s "$(ulimit -H -s)"
          export OMP_STACKSIZE=512M OMP_THREAD_LIMIT="$(nproc)"
          marks="not cuda and not hip and not tensix and not nvidia"
          grep -q avx512f /proc/cpuinfo || marks="not avx512 and $marks"
          PYTHONHASHSEED=0 uv run pytest -n 4 --maxfail=20 -W error -m "$marks" tests \
            --ignore=tests/test_hb_plugin.py --ignore=tests/test_llr_smoke.py

  # The Tensix rows run on Tenstorrent's simulator ttsim inside the pinned tt-metal image (alloy/isa/tensix.py): docker
  # is on every hosted runner, the image is about 5 GB.
  tensix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Tensix rows on ttsim
        run: PYTHONHASHSEED=0 ALLOY_TENSIX_VERDICTS=$RUNNER_TEMP/tensix_verified.toml uv run pytest --maxfail=20 -W error -m tensix tests/test_isa_tensix.py
      # Every eval task's generated program on ttsim, one container per task, at 1 tile and at the most tiles per DST
      # acquire, and with its arrays L1 sharded over 32 cores.
      - name: Generated eval-task programs on ttsim
        run: PYTHONHASHSEED=0 uv run pytest --maxfail=20 -W error -m tensix tests/test_tensixgen.py
      # The verdicts of every row, pending ones included, as `python -m alloy.isa.tensix verify` writes them: copy the
      # file over alloy/isa/tensix_verified.toml and clear the rows' `pending` to record them without a local docker run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensix-verified
          path: ${{ runner.temp }}/tensix_verified.toml
          if-no-files-found: ignore

  # The bench kernels end to end on an in-process judge (libraries graded, scratch requested), on the two compilers
  # every developer box has; a runner of its own, so the toolchain job's interop matrix stays short.
  bench-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LLVM_VERSION: "21"
      GCC_VERSION: "14"
    steps:
      - uses: actions/checkout@v4
      - name: Grading seal and perf events
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then echo 0 | sudo tee "$knob" > /dev/null; fi
          sudo sysctl -w kernel.perf_event_paranoid=1
      - name: gcc
        run: |
          # The runner's mirror list names Canonical hosts only; when their DNS is down no job installs anything.
          echo -e 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:9' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-$GCC_VERSION g++-$GCC_VERSION libopenblas-dev liblapacke-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$GCC_VERSION 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-$GCC_VERSION 100
      - name: clang + LLVM libomp
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh $LLVM_VERSION
          sudo apt-get install -y libomp-$LLVM_VERSION-dev
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - name: Tests
        run: |
          ulimit -s "$(ulimit -H -s)"
          export OMP_STACKSIZE=512M OMP_THREAD_LIMIT="$(nproc)"
          PYTHONHASHSEED=0 uv run pytest -n 2 --maxfail=20 -W error --durations=10 \
            tests/test_hb_plugin.py tests/test_llr_smoke.py
